left\", text: \"I definitely need to plan a visit there soon. Did you take any photos? 📸\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"right\", text: \"Flash photography wasn't allowed, but I bought a beautiful book from the gift shop to show you! 📖\" }\n],\n[\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"left\", text: \"Giuseppe, I went to that new Indian restaurant last night. The flavors were absolutely incredible. 🍛\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"right\", text: \"Oh, I've been meaning to go there! Was the food very spicy? 🌶️\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"left\", text: \"Some dishes were quite hot, but it was a complex spice. The chicken tikka masala was cooked perfectly. 🍗\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"right\", text: \"I've read that tikka masala was actually invented in Britain, not India! It's a fusion dish. 🇬🇧\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"left\", text: \"Really? That's a fascinating piece of cultural history. Food travels and adapts everywhere. 🌍\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"right\", text: \"Exactly. Did you try the garlic naan bread? It is usually baked in a traditional clay oven. 🫓\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"left\", text: \"Yes, it was served warm and it was delicious. Sharing meals is such an important part of their culture. 👨‍👩‍👧‍👦\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"right\", text: \"I think every culture revolves around food to some degree. It's how we celebrate and connect. 🥂\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"left\", text: \"I completely agree. We should go there together next week so you can try it yourself! 📅\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"right\", text: \"Count me in! I love exploring new culinary traditions. 😋\" }\n],\n[\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"left\", text: \"Florian, I was invited to my coworker's wedding next month. It's a traditional Japanese ceremony. 🎎\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"right\", text: \"Wow, what an honor! Do you know what customs you are expected to follow? 🤔\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"left\", text: \"I'm a bit nervous because I don't know the etiquette. I know that money is usually given as a gift. 💴\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"right\", text: \"Yes, the money is placed in a special decorative envelope. Make sure the bills are brand new! ✉️\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"left\", text: \"That is such a specific detail! I will have to go to the bank to request crisp notes. 🏦\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"right\", text: \"Also, avoid wearing black clothes or white clothes. Those colors are usually reserved for the bride and for mourning. 👗\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"left\", text: \"Thank you for the advice. It's amazing how wedding traditions differ so much around the world. 🌍\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"right\", text: \"They really do. But celebrating love and union is a universal human experience. ❤️\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"left\", text: \"Very true. I'm excited to witness such a beautiful cultural event firsthand. 🌸\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"right\", text: \"Take lots of mental notes! I can't wait to hear all about it when you return. 👂\" }\n],\n[\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"left\", text: \"Remy, what are your family's customs for the winter holidays? Do you have any special traditions? ❄️\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"right\", text: \"We have a large family gathering every Christmas Eve. A massive feast is prepared by my grandmother. 🦃\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"left\", text: \"That sounds lovely. In my family, we open one small present on Christmas Eve before going to sleep. 🎁\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"right\", text: \"That's a nice way to build excitement! We usually spend the evening singing traditional carols around the piano. 🎶\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"left\", text: \"I love that. Music is such a powerful way to pass down cultural heritage to the next generation. 👨‍👩‍👧‍👦\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"right\", text: \"It really is. Some of the songs we sing are hundreds of years old. Do you bake anything special? 🍪\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"left\", text: \"Yes, gingerbread cookies are baked every year. The recipe was passed down from my great-grandmother. 👵\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"right\", text: \"Traditions like that make the holidays feel so much more meaningful and personal. ❤️\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"left\", text: \"I agree. In a fast-paced world, it's comforting to have rituals that remain the same every year. 🕯️\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"right\", text: \"Well said, Vivienne. I'll have to trade you some of my grandmother's cake for your gingerbread this year! 🍰\" }\n]\n]\n},\n\"Sports\": {\ntitle: \"Sports ⚽\", emoji: \"⚽\",\nreview: { \nkeywords: \"tournament, referee, score, penalty, stadium, coach, championship, athlete, work out, team spirit\", \ngrammar: \"Past continuous vs Past simple (was playing when...)\" \n},\nconversations: [\n[\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"left\", text: \"Remy, did you watch the championship football match last night? It was incredibly tense! ⚽\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"right\", text: \"I did! I was watching the game when the power suddenly went out in my apartment. I missed the ending! 📺\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"left\", text: \"Oh no! You missed the best part. The star athlete scored a goal in the final minute. 🥅\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"right\", text: \"Are you serious? What was the final score? 🔢\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"left\", text: \"It was two to one. The other team was playing really well until they received a red card. 🟥\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"right\", text: \"Wow. Did the referee make a fair call, or was it a controversial decision? ⚖️\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"left\", text: \"It was a clear penalty. The player committed a dangerous foul near the goal line. 🛑\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"right\", text: \"I guess their coach must have been furious. Winning the tournament is everything for that team. 🏆\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"left\", text: \"He was! But that's sports. The atmosphere in the stadium must have been electric. ⚡\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"right\", text: \"I'll have to watch the highlights online right now so I can see that final goal! 💻\" }\n],\n[\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"left\", text: \"Vivienne, our tennis tournament is next weekend! We really need to practice our serves. 🎾\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-purple\", side: \"right\", text: \"I know. I was practicing my backhand yesterday when it started raining heavily. 🌧️\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"left\", text: \"That's unfortunate. We have to book an indoor court if the weather continues to be this bad. 🏟️\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-purple\", side: \"right\", text: \"Good idea. I feel like my stamina is low. I haven't been working out enough lately. 🏃‍♀️\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"left\", text: \"Don't worry, we rely on team spirit! In doubles, communication is just as important as fitness. 🗣️\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-purple\", side: \"right\", text: \"You're right. As long as we coordinate our movements, we have a solid chance of winning a medal. 🏅\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"left\", text: \"Exactly. The coach told us that our opponents have a weak defense. We should play aggressively. 💥\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-purple\", side: \"right\", text: \"I'll stretch properly before we play. Last time, I pulled a muscle because I didn't warm up. 🤕\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"left\", text: \"Yes, avoiding injuries is the most crucial part of being an athlete. Let's meet at the gym tonight! 💪\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-purple\", side: \"right\", text: \"I'll be there at six. Let's go win that championship! 🎉\" }\n],\n[\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"left\", text: \"Florian, I'm thinking about joining the new gym downtown. Have you ever been there? 🏋️‍♂️\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"right\", text: \"Yes, I go there three times a week! It has great equipment and the staff is very friendly. 👍\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"left\", text: \"I want to improve my cardiovascular health. Do they have a good selection of treadmills and bikes? 🚴\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"right\", text: \"Plenty. I was running on the treadmill yesterday when a personal trainer offered me some great advice. 🏃\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"left\", text: \"Oh, that's helpful. I'm a bit intimidated by the weightlifting section, to be honest. 🏋️\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"right\", text: \"Don't be! Everyone starts somewhere as a beginner. You just have to focus on your own progress. 📈\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"left\", text: \"Do they offer any group fitness classes? I think working out with others would motivate me more. 👥\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"right\", text: \"They have yoga, pilates, and high-intensity interval training. The team spirit in the classes is excellent. 🧘‍♂️\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"left\", text: \"That settles it. I'm going to sign up for a membership after work today. 📝\" },\n{ name: \"Florian\", gender: \"m\", voice: \"florian\", theme: \"theme-slate\", side: \"right\", text: \"Let me know when you do, we can become workout partners! It's harder to skip a session if someone is waiting for you. 🤝\" }\n],\n[\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"left\", text: \"Seraphina, congratulations on your performance in the swimming competition yesterday! 🏊‍♀️\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"right\", text: \"Thank you, Remy! I was so nervous before the race started. My heart was pounding. 💓\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"left\", text: \"You didn't look nervous at all. Your technique was flawless during the butterfly stroke. 🦋\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"right\", text: \"I was breathing heavily during the last lap. I thought the athlete in the next lane was going to pass me! 🏁\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"left\", text: \"She was very close, but you touched the wall first. Did you beat your personal record? ⏱️\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"right\", text: \"I did! I shaved two whole seconds off my best time. My coach was absolutely thrilled. 😁\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"left\", text: \"All those early morning practice sessions clearly paid off. Dedication is everything in sports. 🌅\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"right\", text: \"It's true. Sometimes I hate getting out of bed at 5 AM, but moments like yesterday make it worthwhile. 🥇\" },\n{ name: \"Remy\", gender: \"m\", voice: \"remy\", theme: \"theme-blue\", side: \"left\", text: \"Are you taking a few days off to recover now? Your muscles must be exhausted. 🛌\" },\n{ name: \"Seraphina\", gender: \"f\", voice: \"seraphina\", theme: \"theme-rose\", side: \"right\", text: \"Just one rest day. The regional tournament is only three weeks away, so the training continues! 🚀\" }\n],\n[\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"left\", text: \"Giuseppe, how was your skiing trip in the mountains? Did you have good snow? ⛷️\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"right\", text: \"The snow was perfect powder, but the trip didn't end well. I had a slight accident on the second day. 💥\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"left\", text: \"Oh no! Are you okay? What happened? 😧\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"right\", text: \"I was skiing down a steep slope when I lost my balance and tumbled into a snowbank. ❄️\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"left\", text: \"That sounds terrifying! Did you break any bones? Winter sports can be so dangerous. 🚑\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"right\", text: \"Luckily, no broken bones. I just sprained my wrist and bruised my ego quite a bit! 😅\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"left\", text: \"Well, I'm glad it wasn't more serious. Did you have to go to the hospital? 🏥\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"right\", text: \"Just to the local clinic for an X-ray. The doctor told me I have to wear a brace for two weeks. 🤕\" },\n{ name: \"Vivienne\", gender: \"f\", voice: \"vivienne\", theme: \"theme-emerald\", side: \"left\", text: \"You must be so frustrated. You were looking forward to that trip for months. 📆\" },\n{ name: \"Giuseppe\", gender: \"m\", voice: \"giuseppe\", theme: \"theme-amber\", side: \"right\", text: \"It's disappointing, but accidents happen. I'll just have to be more careful next season! 🎿\" }\n]\n]\n}\n};\n\nconst synth = window.speechSynthesis;\nlet currentLessonData = null;\nlet convoIndex = 0;\nlet isTtsActive = false;\nlet currentConvoType = 1;\nlet currentTopicKey = null;\nlet voicesReady = false;\n\n// Dictionary to hold dynamically fetched voices\nconst voiceDict = {};\n\nconst emojiRegex = /[\\u{1F300}-\\u{1F9FF}]|[\\u{2600}-\\u{26FF}]|[\\u{2700}-\\u{27BF}]|[\\u{1F100}-\\u{1F1FF}]|[\\u{1F600}-\\u{1F64F}]|[\\u{1F680}-\\u{1F6FF}]|[\\u{1F700}-\\u{1F77F}]|[\\u{1F780}-\\u{1F7FF}]|[\\u{1F800}-\\u{1F8FF}]|[\\u{1F900}-\\u{1F9FF}]|[\\u{1FA00}-\\u{1FA6F}]|[\\u{1FA70}-\\u{1FAFF}]|[\\u{2300}-\\u{23FF}]|[\\u{25A0}-\\u{25FF}]|[\\u{2600}-\\u{26FF}]|[\\u{2700}-\\u{27BF}]|[\\u{2900}-\\u{297F}]|[\\u{2B00}-\\u{2BFF}]|[\\u{3030}]|[\\u{303D}]|[\\u{3297}]|[\\u{3299}]/gu;\n\nfunction wrapEmojis(text) {\nreturn text.replace(emojiRegex, (emoji) => `<span class=\"emoji-wrapper\">${emoji}<\/span>`);\n}\n\nfunction stripEmojis(text) {\nreturn text.replace(emojiRegex, '').trim();\n}\n\nfunction initVoices() {\nconst voices = synth.getVoices();\nconsole.log('Available voices:', voices.map(v => v.name));\n\nconst findVoice = (names) => {\n    for (let name of names) {\n        let v = voices.find(v => v.name.includes(\"Microsoft\") && v.name.includes(name) && v.name.includes(\"Online\"));\n        if (!v) v = voices.find(v => v.name.includes(name));\n        if (v) return v;\n    }\n    return null;\n};\n\n// Fallbacks\nconst defaultFemale = voices.find(v => v.name.includes(\"Female\") && v.lang.startsWith(\"en\")) || voices.find(v => v.lang.startsWith(\"en\")) || voices[0];\nconst defaultMale = voices.find(v => v.name.includes(\"Male\") && v.lang.startsWith(\"en\")) || voices.find(v => v.lang.startsWith(\"en\")) || voices[0];\n\n// Load specific voices\nvoiceDict['william'] = findVoice([\"William\"]) || defaultMale;\nvoiceDict['andrew'] = findVoice([\"Andrew\"]) || defaultMale;\nvoiceDict['brian'] = findVoice([\"Brian\"]) || defaultMale;\nvoiceDict['guy'] = findVoice([\"Guy\", \"Ryan\"]) || defaultMale;\nvoiceDict['christopher'] = findVoice([\"Christopher\", \"Eric\"]) || defaultMale;\nvoiceDict['eric'] = findVoice([\"Eric\", \"Christopher\"]) || defaultMale;\n\nvoiceDict['emma'] = findVoice([\"Emma\"]) || defaultFemale;\nvoiceDict['ava'] = findVoice([\"Ava\"]) || defaultFemale;\nvoiceDict['jenny'] = findVoice([\"Jenny\", \"Aria\"]) || defaultFemale;\nvoiceDict['aria'] = findVoice([\"Aria\", \"Jenny\"]) || defaultFemale;\nvoiceDict['michelle'] = findVoice([\"Michelle\", \"Sonia\", \"Ashley\"]) || defaultFemale;\n\n// NEW MULTILINGUAL VOICES\nvoiceDict['remy'] = findVoice([\"Remy\"]) || defaultMale;\nvoiceDict['giuseppe'] = findVoice([\"Giuseppe\"]) || defaultMale;\nvoiceDict['florian'] = findVoice([\"Florian\"]) || defaultMale;\nvoiceDict['vivienne'] = findVoice([\"Vivienne\"]) || defaultFemale;\nvoiceDict['seraphina'] = findVoice([\"Seraphina\"]) || defaultFemale;\n\nvoicesReady = true;\n}\n\nif (synth.onvoiceschanged !== undefined) {\nsynth.onvoiceschanged = initVoices;\n}\ninitVoices();\n\nfunction speak(text, voice, onEnd) {\nif (!voicesReady) {\nsetTimeout(() => speak(text, voice, onEnd), 100);\nreturn;\n}\ntry {\nif (synth.speaking) synth.cancel();\nconst utter = new SpeechSynthesisUtterance(text);\nutter.voice = voice;\nutter.rate = 1.0; \nutter.onend = onEnd;\nsynth.speak(utter);\n} catch(e) {\nconsole.error('Speak error:', e);\nif (onEnd) onEnd();\n}\n}\n\nfunction showScreen(id) {\ndocument.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));\nconst screen = document.getElementById(id);\nif (screen) screen.classList.add('active');\n}\n\nfunction goToMenu() {\ntry { synth.cancel(); } catch(e) {}\nisTtsActive = false;\nshowScreen('main-menu');\n}\n\nfunction selectUnit(unitKey) {\ntry {\ncurrentLessonData = lessons[unitKey];\ncurrentTopicKey = unitKey;\nif(!currentLessonData) return;\ndocument.getElementById('obj-unit-title').textContent = `${unitKey}: ${currentLessonData.title}`;\nshowScreen('objective-screen');\n} catch(e) {\nconsole.error('Select unit error:', e);\n}\n}\n\nfunction startConversationFlow(convoType) {\ntry {\nif (!voicesReady) {\n// Give it a brief retry if voices haven't loaded yet\ninitVoices();\n}\ncurrentConvoType = convoType;\nsynth.cancel();\nshowScreen('conversation-screen');\ndocument.getElementById('convo-unit-header').textContent = currentLessonData.title + ` (#${convoType})`;\nconst container = document.getElementById('convo-container');\ncontainer.innerHTML = '';\nconvoIndex = 0;\nisTtsActive = true;\nnextTurn();\n} catch(e) {\nconsole.error('Start conversation error:', e);\n}\n}\n\nfunction nextTurn() {\nif (!isTtsActive) return;\ntry {\nif (!currentLessonData.conversations[currentConvoType - 1]) return;\nlet conversation = currentLessonData.conversations[currentConvoType - 1];\nif (convoIndex >= conversation.length) return;\nconst turn = conversation[convoIndex];\nconst container = document.getElementById('convo-container');\nconst bubble = document.createElement('div');\nconst sideClass = turn.side === 'left' ? 'chat-left' : 'chat-right';\nbubble.className = `chat-bubble ${sideClass} ${turn.theme} active fade-in`;\nbubble.innerHTML = `<div class=\"speaker-name\">${turn.name}<\/div>${wrapEmojis(turn.text)}`;\ncontainer.appendChild(bubble);\ncontainer.scrollTop = container.scrollHeight;\nconst allBubbles = container.querySelectorAll('.chat-bubble');\nif (allBubbles.length > 1) allBubbles[allBubbles.length - 2].classList.remove('active');\n\n// Determine correct voice dynamically\nlet voiceToUse = voiceDict[turn.voice];\nif (!voiceToUse) {\n    // Fallback to gender-based default if specific name fails\n    voiceToUse = turn.gender === 'm' ? voiceDict['andrew'] : voiceDict['emma'];\n}\n\nconst cleanText = stripEmojis(turn.text);\nspeak(cleanText, voiceToUse, () => {\nconvoIndex++;\nif (convoIndex < conversation.length) setTimeout(nextTurn, 500);\n});\n} catch(e) {\nconsole.error('Next turn error:', e);\n}\n}\n\nfunction repeatConversation() { startConversationFlow(currentConvoType); }\nfunction nextConversation() { if (currentConvoType < 5) startConversationFlow(currentConvoType + 1); }\nfunction prevConversation() { if (currentConvoType > 1) startConversationFlow(currentConvoType - 1); }\n\nfunction toggleReview() {\nconst modal = document.getElementById('review-modal');\nif (modal.classList.contains('active')) {\nmodal.classList.remove('active');\n} else {\nif (currentLessonData && currentLessonData.review) {\ndocument.getElementById('review-title').textContent = currentLessonData.title;\ndocument.getElementById('review-keywords').textContent = currentLessonData.review.keywords;\ndocument.getElementById('review-grammar').textContent = currentLessonData.review.grammar;\nmodal.classList.add('active');\n}\n}\n}\n\nfunction init() {\ntry {\nconst grid = document.getElementById('unit-grid');\nif (!grid) return;\ngrid.innerHTML = ''; // Clear in case of re-init\nconst topics = Object.keys(lessons);\ntopics.forEach(key => {\nconst btn = document.createElement('button');\nbtn.className = 'unit-btn p-4 rounded-2xl shadow-lg text-center flex flex-col items-center justify-center bg-white';\nbtn.innerHTML = `<div class=\"text-4xl mb-1\">${lessons[key].emoji}<\/div><div class=\"font-black text-indigo-900 text-sm\">${key}<\/div>`;\nbtn.onclick = () => selectUnit(key);\ngrid.appendChild(btn);\n});\n} catch(e) {\nconsole.error('Init error:', e);\n}\n}\n\nif (document.readyState === 'loading') {\ndocument.addEventListener('DOMContentLoaded', init);\n} else {\ninit();\n}\nwindow.onload = function() { initVoices(); setTimeout(init, 200); };\n<\/script>\n<\/body>\n<\/html>\n"};

    let portalStars = 0;

    function updateTtsConfig() {
      window.__PORTAL_TTS__.mode = document.getElementById('voice-select').value;
    }

    function togglePortalSpeed() {
      window.__PORTAL_TTS__.rate = window.__PORTAL_TTS__.rate === 0.85 ? 1.0 : 0.85;
      document.getElementById('portal-speed-btn').textContent = window.__PORTAL_TTS__.rate === 0.85 ? '🐢 0.85x' : '🐇 1.0x';
    }

    function addPortalStar() {
      portalStars++;
      document.getElementById('portal-stars').textContent = portalStars;
      if (typeof confetti === 'function') {
        confetti({ particleCount: 40, spread: 60, origin: { y: 0.7 } });
      }
    }

    function renderPortalMenu() {
      const grid = document.getElementById('portal-grid');
      grid.innerHTML = '';
      PORTAL_MODULES.forEach((mod, idx) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = `btn-3d bg-white hover:bg-slate-50 rounded-3xl border-4 ${mod.border} p-6 text-left flex flex-col justify-between gap-4 shadow-xl`;
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-5xl floating-emoji" style="animation-delay:${(idx * 0.25).toFixed(2)}s">${mod.emoji}</span>
              <span class="text-xs font-extrabold uppercase tracking-wider bg-gradient-to-r ${mod.color} text-white px-3 py-1 rounded-full">${mod.badge}</span>
            </div>
            <h2 class="font-display text-2xl text-slate-900 mb-1">${mod.title}</h2>
            <p class="text-slate-600 font-bold text-base leading-snug">${mod.subtitle}</p>
          </div>
          <div class="w-full py-2.5 rounded-2xl bg-gradient-to-r ${mod.color} text-white font-display text-center text-lg shadow-sm">
            Launch App ➜
          </div>
        `;
        card.onclick = () => launchModule(mod);
        grid.appendChild(card);
      });
    }

    function launchModule(mod) {
      document.getElementById('portal-menu').classList.add('hidden');
      document.getElementById('portal-stage').classList.remove('hidden');
      document.getElementById('portal-active-title').textContent = `${mod.emoji} ${mod.title}`;
      const frame = document.getElementById('app-frame');
      frame.srcdoc = APP_SOURCES[mod.id];
    }

    function showMainMenu() {
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      const frame = document.getElementById('app-frame');
      frame.srcdoc = '';
      document.getElementById('portal-stage').classList.add('hidden');
      document.getElementById('portal-menu').classList.remove('hidden');
      document.getElementById('portal-active-title').textContent = 'Grade 3 Ultimate Portal';
    }

    renderPortalMenu();
  </script>
