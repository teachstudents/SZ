<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Grade 3 Ultimate English Learning Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    html { font-size: 19px; }
    @media (max-width: 640px) { html { font-size: 16px; } }
    body {
      font-family: 'Nunito', 'Comic Sans MS', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 50%, #dcfce7 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }
    .font-display { font-family: 'Fredoka', 'Comic Sans MS', sans-serif; }
    .btn-3d {
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      box-shadow: 0 5px 0 rgba(15, 23, 42, 0.2);
    }
    .btn-3d:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.2);
    }
    @keyframes floatEmoji {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(3deg); }
    }
    .floating-emoji {
      display: inline-block;
      animation: floatEmoji 2.8s ease-in-out infinite;
    }
    .custom-scroll::-webkit-scrollbar { width: 10px; }
    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
  </style>
</head>
<body class="flex flex-col text-slate-800">

        <span class="text-base">⭐</span>
        <span id="portal-stars" class="font-display text-base text-amber-900">0</span>
      </div>
      <button type="button" onclick="addPortalStar()" class="btn-3d bg-emerald-500 hover:bg-emerald-400 text-white font-bold text-xs px-3 py-1.5 rounded-xl border-2 border-emerald-600">

          <span class="floating-emoji" style="animation-delay:0.8s">🎓</span>
          <span class="floating-emoji" style="animation-delay:1.2s">🎮</span>

        <p class="text-slate-600 text-lg font-bold">Large child-friendly fonts • Microsoft Multilingual Voices at 0.85x • 6 Complete Apps</p>
      </div>

    </div>

  <script>
    window.__PORTAL_TTS__ = { rate: 0.85, mode: 'rotate' };

    const PORTAL_MODULES = [{"id": "mega20", "emoji": "🌟", "title": "20-Unit Mega Hub", "subtitle": "1-on-1 Floating Emoji Vocab, Listen, Read, Build & Grammar", "badge": "20 Units • Core", "color": "from-sky-500 to-indigo-600", "border": "border-sky-300"}, {"id": "g3practice", "emoji": "🎓", "title": "Grade 3 English Quest", "subtitle": "Learn & Practice Drag-and-Drop Slots with Confetti", "badge": "Learn + Practice", "color": "from-emerald-500 to-teal-600", "border": "border-emerald-300"}, {"id": "ff3mcq", "emoji": "🏰", "title": "Speaking Quest (FF3 MCQ)", "subtitle": "10-Challenge Listening & Speaking Quizzes with Badges", "badge": "FF3 • Quizzes", "color": "from-purple-500 to-fuchsia-600", "border": "border-purple-300"}, {"id": "ff03", "emoji": "🎮", "title": "Friends & Family 3 Games", "subtitle": "Memory Match, Gap-Fill, Fireworks & Print Certificate", "badge": "FF3 • Arcade", "color": "from-amber-400 to-orange-500", "border": "border-amber-300"}, {"id": "ff04", "emoji": "🚀", "title": "Friends & Family 4 Games", "subtitle": "Level-Up Challenge Games, Tokens & Certificate", "badge": "FF4 • Arcade", "color": "from-rose-500 to-pink-600", "border": "border-rose-300"}, {"id": "ff5topic", "emoji": "💬", "title": "Dialogue Practice (A2/B1)", "subtitle": "Animated Chat Bubbles, Idioms & Collocations", "badge": "Extension • A2/B1", "color": "from-cyan-500 to-blue-600", "border": "border-cyan-300"}];
    const APP_SOURCES = {"mega20": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\" />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\" />\n  <title>Grade 3 1-on-1 English Mega Hub — 20 Units<\/title>\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <script src=\"https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js\"><\/script>\n  <script src=\"https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js\"><\/script>\n  <link href=\"https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap\" rel=\"stylesheet\" />\n  <style>\n    :root { font-size: 18px; }\n    body {\n      font-family: 'Nunito', 'Comic Sans MS', sans-serif;\n      background: linear-gradient(135deg, #e0f2fe 0%, #fef9c3 50%, #dcfce7 100%);\n      height: 100vh;\n      width: 100vw;\n      overflow: hidden;\n      user-select: none;\n      touch-action: manipulation;\n    }\n    .font-display { font-family: 'Fredoka', 'Comic Sans MS', sans-serif; }\n    .btn-3d {\n      transition: transform 0.1s ease, box-shadow 0.1s ease, opacity 0.25s ease;\n      box-shadow: 0 5px 0 rgba(15, 23, 42, 0.22);\n    }\n    .btn-3d:active:not(:disabled) {\n      transform: translateY(4px);\n      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.22);\n    }\n    .tab-pane { display: none; height: 100%; }\n    .tab-pane.active { display: flex; flex-direction: column; }\n\n    /* Floating Emoji Animation */\n    @keyframes floatEmoji {\n      0%, 100% { transform: translateY(0px) rotate(0deg); }\n      50% { transform: translateY(-7px) rotate(2deg); }\n    }\n    .floating-emoji {\n      display: inline-block;\n      animation: floatEmoji 2.8s ease-in-out infinite;\n    }\n    .floating-emoji-delay {\n      display: inline-block;\n      animation: floatEmoji 3.2s ease-in-out 0.6s infinite;\n    }\n\n    .highlight-word {\n      display: inline-block;\n      padding: 2px 4px;\n      border-radius: 6px;\n      transition: background-color 0.12s ease, transform 0.12s ease;\n    }\n    .highlight-word.active {\n      background-color: #fde047;\n      color: #0f172a;\n      transform: scale(1.06);\n      box-shadow: 0 2px 6px rgba(234, 179, 8, 0.35);\n    }\n    .option-removed {\n      opacity: 0;\n      pointer-events: none;\n      transform: scale(0.92);\n      transition: opacity 0.25s ease, transform 0.25s ease;\n    }\n    .option-correct {\n      background-color: #bbf7d0 !important;\n      border-color: #16a34a !important;\n      color: #14532d !important;\n      box-shadow: 0 4px 0 #15803d !important;\n    }\n    .card-selected {\n      border-color: #0284c7 !important;\n      background-color: #e0f2fe !important;\n      transform: scale(1.04);\n      box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.35);\n    }\n    @keyframes shake {\n      0%, 100% { transform: translateX(0); }\n      25% { transform: translateX(-7px); }\n      75% { transform: translateX(7px); }\n    }\n    .shake { animation: shake 0.35s ease-in-out; }\n    @keyframes popIn {\n      0% { transform: scale(0.88); opacity: 0; }\n      100% { transform: scale(1); opacity: 1; }\n    }\n    .pop-in { animation: popIn 0.25s ease-out forwards; }\n    .custom-scroll::-webkit-scrollbar { width: 10px; }\n    .custom-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 8px; }\n    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }\n    @media print {\n      body * { visibility: hidden; }\n      #certificate-card, #certificate-card * { visibility: visible; }\n      #certificate-card { position: fixed; inset: 24px; box-shadow: none !important; }\n    }\n  <\/style>\n\n<link href=\"https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap\" rel=\"stylesheet\" />\n<style>\n  html { font-size: 19px !important; }\n  @media (max-width: 640px) { html { font-size: 16px !important; } }\n  body, button, input, select, p, span, div {\n    font-family: 'Nunito', 'Fredoka', 'Comic Sans MS', sans-serif !important;\n  }\n  h1, h2, h3, .font-display, .font-header {\n    font-family: 'Fredoka', 'Comic Sans MS', sans-serif !important;\n  }\n<\/style>\n<script>\n(function() {\n  if (!window.speechSynthesis) return;\n  const origSpeak = window.speechSynthesis.speak.bind(window.speechSynthesis);\n  const MS_PRIORITY = [\n    'Microsoft Andrew', 'Microsoft Brian', 'Microsoft Emma', 'Microsoft Ava',\n    'Microsoft William', 'Microsoft Giuseppe', 'Microsoft Vivienne',\n    'Microsoft Florian', 'Microsoft Seraphina', 'Microsoft Remy',\n    'Andrew', 'Brian', 'Emma', 'Ava', 'William'\n  ];\n  let rotateIdx = 0;\n\n  function getMsMultilingualPool() {\n    const voices = window.speechSynthesis.getVoices() || [];\n    const pool = [];\n    for (const key of MS_PRIORITY) {\n      const match = voices.find(v =>\n        v.name && v.name.includes(key) &&\n        (!v.lang || v.lang.startsWith('en') || v.name.toLowerCase().includes('multilingual'))\n      );\n      if (match && !pool.includes(match)) pool.push(match);\n    }\n    if (pool.length) return pool;\n    return voices.filter(v => v.lang && v.lang.startsWith('en'));\n  }\n\n  function stripEmojis(txt) {\n    return String(txt || '')\n      .replace(/[\\u{1F300}-\\u{1FAFF}\\u{2600}-\\u{27BF}\\u{1F1E6}-\\u{1F1FF}]/gu, '')\n      .replace(/\\s+/g, ' ')\n      .trim();\n  }\n\n  window.speechSynthesis.speak = function(utter) {\n    try {\n      if (utter && typeof utter.text === 'string') {\n        utter.text = stripEmojis(utter.text);\n      }\n      const cfg = (window.parent && window.parent.__PORTAL_TTS__) || { rate: 0.85, mode: 'rotate' };\n      const pool = getMsMultilingualPool();\n      if (pool.length) {\n        if (cfg.mode === 'rotate') {\n          utter.voice = pool[rotateIdx % pool.length];\n          rotateIdx++;\n        } else {\n          const locked = pool.find(v => v.name.includes(cfg.mode)) || pool[0];\n          utter.voice = locked;\n        }\n      }\n      utter.rate = cfg.rate || 0.85;\n    } catch (e) {}\n    return origSpeak(utter);\n  };\n})();\n<\/script>\n\n<\/head>\n<body class=\"flex flex-col text-slate-800\">\n\n  <!-- START OVERLAY & 20-UNIT GRID -->\n  <div id=\"start-overlay\" class=\"fixed inset-0 z-50 bg-sky-500/95 backdrop-blur-sm flex items-center justify-center p-4\">\n    <div class=\"bg-white rounded-3xl border-4 border-sky-200 shadow-2xl max-w-5xl w-full max-h-[94vh] flex flex-col p-6 pop-in overflow-hidden\">\n      <div class=\"text-center shrink-0 mb-4\">\n        <div class=\"text-4xl mb-1\"><span class=\"floating-emoji\">🌟<\/span> <span class=\"floating-emoji-delay\">🚀<\/span> <span class=\"floating-emoji\">🎯<\/span><\/div>\n        <h1 class=\"font-display text-3xl md:text-4xl text-sky-700\">Grade 3 1-on-1 English Mega Club<\/h1>\n        <p class=\"text-slate-600 text-base\">20 Units • Emoji Vocab → Listening → Reading → Sentence Builder → Grammar → Extra Practice<\/p>\n      <\/div>\n\n      <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4 mb-4 shrink-0\">\n        <div>\n          <label for=\"student-name-input\" class=\"block text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-1\">Student Name<\/label>\n          <input id=\"student-name-input\" type=\"text\" placeholder=\"Type your name...\" class=\"w-full px-4 py-2.5 text-lg font-bold border-4 border-sky-200 rounded-2xl focus:outline-none focus:border-sky-500 text-slate-800\" />\n        <\/div>\n        <div>\n          <span class=\"block text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-1\">Pick Your Avatar<\/span>\n          <div id=\"avatar-picker\" class=\"grid grid-cols-6 gap-2\">\n            <button type=\"button\" data-avatar=\"🦊\" class=\"avatar-btn text-2xl py-1.5 rounded-2xl border-4 border-sky-500 bg-sky-50 transition\">🦊<\/button>\n            <button type=\"button\" data-avatar=\"🐼\" class=\"avatar-btn text-2xl py-1.5 rounded-2xl border-4 border-slate-200 bg-white hover:bg-slate-50 transition\">🐼<\/button>\n            <button type=\"button\" data-avatar=\"🦁\" class=\"avatar-btn text-2xl py-1.5 rounded-2xl border-4 border-slate-200 bg-white hover:bg-slate-50 transition\">🦁<\/button>\n            <button type=\"button\" data-avatar=\"🐰\" class=\"avatar-btn text-2xl py-1.5 rounded-2xl border-4 border-slate-200 bg-white hover:bg-slate-50 transition\">🐰<\/button>\n            <button type=\"button\" data-avatar=\"🐸\" class=\"avatar-btn text-2xl py-1.5 rounded-2xl border-4 border-slate-200 bg-white hover:bg-slate-50 transition\">🐸<\/button>\n            <button type=\"button\" data-avatar=\"🦄\" class=\"avatar-btn text-2xl py-1.5 rounded-2xl border-4 border-slate-200 bg-white hover:bg-slate-50 transition\">🦄<\/button>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"text-xs font-extrabold uppercase tracking-wider text-slate-500 mb-2 shrink-0\">Pick a Unit to Start (All 20 Units Unlocked!):<\/div>\n      <div id=\"unit-menu-grid\" class=\"grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-2.5 overflow-y-auto custom-scroll pr-1 pb-2 flex-1\"><\/div>\n    <\/div>\n  <\/div>\n\n  <!-- STICKY TOP HUD -->\n  <header class=\"bg-white/95 backdrop-blur-sm border-b-4 border-sky-200 px-3 py-2 flex flex-wrap items-center justify-between gap-2 shrink-0 z-30 shadow-sm\">\n    <div class=\"flex items-center gap-2\">\n      <button type=\"button\" onclick=\"openHomeMenu()\" class=\"btn-3d bg-slate-100 hover:bg-slate-200 text-slate-800 font-display text-xs px-2.5 py-1.5 rounded-xl border-2 border-slate-300\">🏠 20 Units<\/button>\n      <div class=\"flex items-center gap-1.5 bg-sky-50 border-2 border-sky-200 rounded-2xl px-2.5 py-1\">\n        <span id=\"hud-avatar\" class=\"text-xl\">🦊<\/span>\n        <span id=\"hud-name\" class=\"font-display text-sm text-sky-900\">Explorer<\/span>\n      <\/div>\n      <div class=\"flex items-center gap-1 bg-amber-100 border-2 border-amber-300 rounded-2xl px-2.5 py-1\">\n        <span class=\"text-base\">⭐<\/span>\n        <span id=\"hud-stars\" class=\"font-display text-base text-amber-900\">0<\/span>\n      <\/div>\n      <select id=\"hud-unit-select\" onchange=\"switchUnit(this.value)\" class=\"bg-indigo-50 border-2 border-indigo-200 text-indigo-900 font-extrabold text-xs rounded-xl px-2 py-1.5 cursor-pointer outline-none max-w-[175px]\"><\/select>\n    <\/div>\n\n    <!-- 6-Stage Pedagogical Pipeline Nav -->\n    <nav class=\"flex flex-wrap items-center gap-1\">\n      <button type=\"button\" onclick=\"switchTab('vocab')\" id=\"nav-vocab\" class=\"nav-tab btn-3d bg-pink-500 text-white font-display text-xs px-2.5 py-1.5 rounded-xl border-2 border-pink-600\">1. 🃏 Vocab<\/button>\n      <button type=\"button\" onclick=\"switchTab('listen')\" id=\"nav-listen\" class=\"nav-tab btn-3d bg-white text-slate-700 font-display text-xs px-2.5 py-1.5 rounded-xl border-2 border-slate-200\">2. 🎧 Listen<\/button>\n      <button type=\"button\" onclick=\"switchTab('read')\" id=\"nav-read\" class=\"nav-tab btn-3d bg-white text-slate-700 font-display text-xs px-2.5 py-1.5 rounded-xl border-2 border-slate-200\">3. 📖 Read<\/button>\n      <button type=\"button\" onclick=\"switchTab('build')\" id=\"nav-build\" class=\"nav-tab btn-3d bg-white text-slate-700 font-display text-xs px-2.5 py-1.5 rounded-xl border-2 border-slate-200\">4. 🧱 Build<\/button>\n      <button type=\"button\" onclick=\"switchTab('grammar')\" id=\"nav-grammar\" class=\"nav-tab btn-3d bg-white text-slate-700 font-display text-xs px-2.5 py-1.5 rounded-xl border-2 border-slate-200\">5. 🧩 Grammar<\/button>\n      <button type=\"button\" onclick=\"switchTab('extra')\" id=\"nav-extra\" class=\"nav-tab btn-3d bg-white text-slate-700 font-display text-xs px-2.5 py-1.5 rounded-xl border-2 border-slate-200\">6. 🔁 Extra<\/button>\n      <button type=\"button\" onclick=\"switchTab('reward')\" id=\"nav-reward\" class=\"nav-tab btn-3d bg-   }\n    }\n    function playChime(type) {\n      if (!state.sfx || !synth) return;\n      try {\n        if (type === 'good') {\n          synth.triggerAttackRelease('C5', '16n', Tone.now());\n          synth.triggerAttackRelease('E5', '16n', Tone.now() + 0.08);\n          synth.triggerAttackRelease('G5', '8n', Tone.now() + 0.16);\n        } else {\n          synth.triggerAttackRelease('A3', '16n', Tone.now());\n        }\n      } catch (e) {}\n    }\n    function pickVoice() {\n      const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];\n      const preferred = ['Andrew', 'Emma', 'Brian', 'Ava', 'Google US English', 'Samantha', 'Zira', 'David'];\n      for (const name of preferred) {\n        const match = voices.find(v => v.name.includes(name) && v.lang && v.lang.startsWith('en'));\n        if (match) return match;\n      }\n      return voices.find(v => v.lang && v.lang.startsWith('en')) || null;\n    }\n    if (window.speechSynthesis && window.speechSynthesis.onvoiceschanged !== undefined) {\n      window.speechSynthesis.onvoiceschanged = () => pickVoice();\n    }\n    function stripEmojis(str) {\n      return str.replace(/[\\u{1F300}-\\u{1FAFF}\\u{2600}-\\u{27BF}\\u{1F1E6}-\\u{1F1FF}]/gu, '').replace(/\\s+/g, ' ').trim();\n    }\n    function stopSpeech() {\n      if (window.speechSynthesis) window.speechSynthesis.cancel();\n      document.querySelectorAll('.highlight-word').forEach(el => el.classList.remove('active'));\n    }\n    function speakText(text, onBoundaryWordIndex = null, onDone = null) {\n      if (!window.speechSynthesis) return;\n      stopSpeech();\n      const clean = stripEmojis(text);\n      const utter = new SpeechSynthesisUtterance(clean);\n      const voice = pickVoice();\n      if (voice) utter.voice = voice;\n      utter.rate = state.speechRate;\n      utter.pitch = 1.02;\n      if (onBoundaryWordIndex) {\n        utter.onboundary = (ev) => {\n          if (ev.name === 'word') {\n            const prefix = cle nt-display text-sm text-slate-900 leading-tight\">${u.title}<\/span>`;\n        card.onclick = () => startWithUnit(u.id);\n        grid.appendChild(card);\n      });\n    }\n\n    function openHomeMenu() { stopSpeech(); document.getElementById('start-overlay').classList.remove('hidden'); }\n\n    function startWithUnit(unitId) {\n      initAudio();\n      const rawName = document.getElementById('student-name-input').value.trim();\n      state.name = rawName || 'Explorer';\n      document.getElementById('hud-name').textContent = state.name;\n      document.getElementById('hud-avatar').textContent = state.avatar;\n      document.getElementById('sp-student-avatar').textContent = state.avatar;\n      document.getElementById('start-overlay').classList.add('hidden');\n      playChime('good');\n      switchUnit(unitId);\n      switchTab('vocab');\n    }\n\n    function switchUnit(unitId) {\n      stopSpeech();\n      state.unitId = unitId;\n      state.selectedEmojiIdx = null;\n      state.leIndex = 0;\n      state.rqIndex = 0;\n      state.spIndex = 0;\n      state.gqIndex = 0;\n      state.exIndex = 0;\n      state.spTokens = [];\n      const firstBlank = currentUnit().fill.findIndex((_, i) => !unitProg().fill[i]);\n      state.activeBlank = firstBlank === -1 ? 0 : firstBlank;\n      document.getElementById('hud-unit-select').value = unitId;\n      renderAll();\n    }\n\n    function switchTab(tab) {\n      stopSpeech();\n      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));\n      document.getElementById(`tab-${tab}`).classList.add('active');\n      document.querySelectorAll('.nav-tab').forEach(btn => {\n        btn.className = 'nav-tab btn-3d bg-white text-slate-700 font-display text-xs px-2.5 py-1.5 rounded-xl border-2 border-slate-200';\n      });\n      const colorMap = {\n        vocab: 'bg-pink-500 text-white border-pink-600',\n        listen: 'bg-sky-500 text-white border-sky-600',\n        read: 'bg-amber-400 text-slate-900 bor ripEmojis(w.textContent));\n      speakText(text, (idx) => {\n        document.querySelectorAll('.highlight-word').forEach(w => w.classList.remove('active'));\n        if (words[idx]) words[idx].classList.add('active');\n      }, () => document.querySelectorAll('.highlight-word').forEach(w => w.classList.remove('active')));\n    }\n    function renderReadQ() {\n      const list = currentUnit().readQ;\n      const q = list[state.rqIndex];\n      const solved = unitProg().rq;\n      document.getElementById('rq-counter').textContent = `${state.rqIndex + 1} / ${list.length}`;\n      document.getElementById('rq-prompt').textContent = q.p;\n      const box = document.getElementById('rq-options');\n      const fb = document.getElementById('rq-feedback');\n      box.innerHTML = '';\n      fb.textContent = '';\n\n      const isDone = !!solved[state.rqIndex];\n      q.o.forEach((opt, idx) => {\n        const btn = document.createElement('button');\n        btn.type = 'button';\n        btn.className = 'btn-3d text-left px-4 py-3 rounded-2xl border-3 border-slate-200 bg-slate-50 hover:bg-sky-50 font-extrabold text-lg text-slate-800';\n        btn.textContent = opt;\n        if (isDone) {\n          btn.disabled = true;\n          if (idx === q.a) btn.classList.add('option-correct');\n          else btn.classList.add('option-removed');\n        } else {\n          btn.onclick = () => {\n            initAudio();\n            if (idx === q.a) {\n              playChime('good');\n              solved[state.rqIndex] = true;\n              addStars(1);\n              renderReadQ();\n              fb.textContent = '🎉 Great reading! +1 Star!';\n              fb.className = 'mt-3 text-center font-display text-lg text-emerald-600';\n            } else {\n              playChime('bad');\n              btn.classList.add('shake');\n              setTimeout(() => btn.classList.add('option-removed'), 250);\n              fb.textContent = 'Check the story and try again!';\n              fb.className = 'mt-3 text-center font-display text-base text-amber-600';\n            }\n          };\n        }\n        box.appendChild(btn);\n      });\n      if (isDone) {\n        fb.textContent = '✅ Correct answer saved!';\n        fb.className = 'mt-3 text-center font-display text-lg text-emerald-600';\n      }\n    }\n    function changeReadQ(d) { const len = currentUnit().readQ.length; state.rqIndex = (state.rqIndex + d + len) % len; renderReadQ(); }\n    function speakReadQ() { speakText(currentUnit().readQ[state.rqIndex].p); }\n\n    // --- STAGE 4: SENTENCE BUILDER ---\n    function renderSpeak() {\n      const list = currentUnit().speak;\n      const p = list[state.spIndex];\n      document.getElementById('sp-counter').textContent = `${state.spIndex + 1} / ${list.length}`;\n      document.getElementById('sp-teacher-q').textContent = p.q;\n      const renderChips = (elId, items, cls) => {\n        const box = document.getElementById(elId);\n        box.innerHTML = '';\n        items.forEach(phrase => {\n          const btn = document.createElement('button');\n          btn.type = 'button';\n          btn.className = `btn-3d px-4 py-2 rounded-2xl border-2 font-extrabold text-base ${cls}`;\n          btn.textContent = phrase;\n          btn.onclick = () => { state.spTokens.push(phrase); updateBuiltSentence(); };\n          box.appendChild(btn);\n        });\n      };\n      renderChips('sp-starters', p.s, 'bg-sky-50 border-sky-300 text-sky-900 hover:bg-sky-100');\n      renderChips('sp-actions', p.a, 'bg-emerald-50 border-emerald-300 text-emerald-900 hover:bg-emerald-100');\n      renderChips('sp-details', p.d, 'bg-amber-50 border-amber-300 text-amber-900 hover:bg-amber-100');\n      updateBuiltSentence();\n    }\n    function updateBuiltSentence() {\n      document.getElementById('sp-built-sentence').textContent = state.spTokens.length ? state.spTokens.join(' ') : 'Tap chips above to build your sentence...';\n    }\n    function clearBuiltSentence() { state.sp pointer ${isDone ? 'bg-emerald-50 border-emerald-400' : isTarget ? 'bg-sky-50 border-sky-400' : 'bg-slate-50 border-slate-200'}`;\n        row.onclick = () => { if (!isDone) { state.activeBlank = idx; renderFill(); } };\n        const textWrap = document.createElement('div');\n        textWrap.className = 'text-xl font-extrabold text-slate-800 flex flex-wrap items-center gap-2';\n        textWrap.innerHTML = `<span>${idx + 1}. ${item.b}<\/span>\n          <span class=\"inline-flex items-center justify-center min-w-[5rem] px-3 py-1 rounded-xl border-2 ${isDone ? 'bg-emerald-500 text-white border-emerald-600' : 'bg-white text-sky-700 border-sky-400 border-dashed'}\">${isDone ? item.ans : '_____'}<\/span>\n          <span>${item.a}<\/span>`;\n        const hearBtn = document.createElement('button');\n        hearBtn.type = 'button';\n        hearBtn.className = 'btn-3d bg-white px-3 py-1.5 rounded-xl border-2 border-slate-200 text-sm font-bold';\n        hearBtn.textContent = '🔊';\n        hearBtn.onclick = (e) => { e.stopPropagation(); speakText(`${item.b} ${isDone ? item.ans : 'blank'} ${item.a}`); };\n        row.appendChild(textWrap);\n        row.appendChild(hearBtn);\n        container.appendChild(row);\n      });\n      const bank = document.getElementById('fill-word-bank');\n      bank.innerHTML = '';\n      u.bank.forEach((word) => {\n        const btn = document.createElement('button');\n        btn.type = 'button';\n        btn.className = 'btn-3d bg-white hover:bg-emerald-100 text-slate-900 font-display text-xl px-6 py-2.5 rounded-2xl border-2 border-emerald-400';\n        btn.textContent = word;\n        btn.onclick = () => {\n          initAudio();\n          const item = u.fill[state.activeBlank];\n          if (!item || solved[state.activeBlank]) return;\n          if (word === item.ans) {\n            playChime('good');\n            solved[state.activeBlank] = true;\n            addStars(1);\n            const next = u.fill.findIndex((_, i) => !solved[i]);\n            state.activeBlank = next === -1 ? 0 : next;\n            renderFill();\n          } else {\n            playChime('bad');\n            btn.classList.add('shake');\n            setTimeout(() => btn.classList.add('option-removed'), 250);\n          }\n        };\n        bank.appendChild(btn);\n      });\n    }\n    function renderGrammarQ() {\n      const list = currentUnit().quiz;\n      const q = list[state.gqIndex];\n      const solved = unitProg().gq;\n      document.getElementById('gq-counter').textContent = `Question ${state.gqIndex + 1} / ${list.length}`;\n      document.getElementById('gq-prompt').textContent = q.p;\n      const box = document.getElementById('gq-options');\n      const fb = document.getElementById('gq-feedback');\n      box.innerHTML = '';\n      fb.textContent = '';\n      const isDone = !!solved[state.gqIndex];\n      q.o.forEach((opt, idx) => {\n        const btn = document.createElement('button');\n        btn.type = 'button';\n        btn.className = 'btn-3d px-6 py-4 rounded-2xl border-3 border-slate-200 bg-slate-50 hover:bg-emerald-50 font-display text-2xl text-slate-800';\n        btn.textContent = opt;\n        if (isDone) {\n          btn.disabled = true;\n          if (idx === q.a) btn.classList.add('option-correct');\n          else btn.classList.add('option-removed');\n        } else {\n          btn.onclick = () => {\n            initAudio();\n            if (idx === q.a) {\n              playChime('good');\n              solved[state.gqIndex] = true;\n              addStars(1);\n              renderGrammarQ();\n              fb.textContent = '🎉 Spot on! +1 Star!';\n              fb.className = 'mt-3 text-center font-display text-xl text-emerald-600';\n            } else {\n              playChime('bad');\n              btn.classList.add('shake');\n              setTimeout(() => btn.classList.add('option-removed'), 250);\n              fb.textContent = 'Try another one!';\n              fb.className = 'mt-3 text-center font-display text-lg text-amber-600';\n            }\n          };\n        }\n        box.appendChild(btn);\n      });\n      if (isDone) {\n        fb.textContent = '✅ Correct answer locked in!';\n        fb.className = 'mt-3 text-center font-display text-xl text-emerald-600';\n      }\n    }\n    function changeGrammarQ(d) { const len = currentUnit().quiz.length; state.gqIndex = (state.gqIndex + d + len) % len; renderGrammarQ(); }\n    function speakGrammarQ() { speakText(currentUnit().quiz[state.gqIndex].p.replace('___', 'blank')); }\n\n    // --- STAGE 6: EXTRA PRACTICE ---\n    function renderExtra() {\n      const list = currentUnit().extra;\n      const q = list[state.exIndex];\n      const solved = unitProg().ex;\n      document.getElementById('ex-counter').textContent = `${state.exIndex + 1} / ${list.length}`;\n      document.getElementById('ex-type').textContent = q.type;\n      document.getElementById('ex-prompt').textContent = q.p;\n      const box = document.getElementById('ex-options');\n      const fb = document.getElementById('ex-feedback');\n      box.innerHTML = '';\n      fb.textContent = '';\n      const isDone = !!solved[state.exIndex];\n      q.o.forEach((opt, idx) => {\n        const btn = document.createElement('button');\n        btn.type = 'button';\n        btn.className = 'btn-3d px-6 py-4 rounded-2xl border-3 border-slate-200 bg-slate-50 hover:bg-indigo-50 font-display text-2xl text-slate-800';\n        btn.textContent = opt;\n        if (isDone) {\n          btn.disabled = true;\n          if (idx === q.a) btn.classList.add('option-correct');\n          else btn.classList.add('option-removed');\n        } else {\n          btn.onclick = () => {\n            initAudio();\n            if (idx === q.a) {\n              playChime('good');\n              solved[state.exIndex] = true;\n              addStars(1);\n              renderExtra();\n              fb.textContent = '🎉 Bonus Star Earned! +1 Star!';\n              fb.className = 'text-center font-display text-xl text-emerald-600';\n            } else {\n              playChime('bad');\n              btn.classList.add('shake');\n              setTimeout(() => btn.classList.add('option-removed'), 250);\n              fb.textContent = 'Try another one!';\n              fb.className = 'text-center font-display text-lg text-amber-600';\n            }\n          };\n        }\n        box.appendChild(btn);\n      });\n      if (isDone) {\n        fb.textContent = '✅ Bonus challenge complete!';\n        fb.className = 'text-center font-display text-xl text-emerald-600';\n      }\n    }\n    function changeExtra(d) { const len = currentUnit().extra.length; state.exIndex = (state.exIndex + d + len) % len; renderExtra(); }\n    function speakExtra() { speakText(currentUnit().extra[state.exIndex].say); }\n\n    // --- CERTIFICATE & RENDER ALL ---\n    function updateCertificate() {\n      const u = currentUnit();\n      const p = unitProg();\n      document.getElementById('cert-unit-label').textContent = `Unit ${u.num}: ${u.title} (${u.grammarTag})`;\n      document.getElementById('cert-name').textContent = state.name;\n      document.getElementById('cert-avatar').textContent = state.avatar;\n      document.getElementById('cert-vocab').textContent = `${Object.keys(p.vocab).length + Object.keys(p.le).length} / ${u.vocab.length * 2}`;\n      document.getElementById('cert-read').textContent = `${Object.keys(p.rq).length} / ${u.readQ.length}`;\n      document.getElementById('cert-grammar').textContent = `${Object.keys(p.fill).length + Object.keys(p.gq).length + Object.keys(p.ex).length} / ${u.fill.length + u.quiz.length + u.extra.length}`;\n      document.getElementById('cert-stars').textContent = `⭐ ${state.stars}`;\n    }\n\n    function renderAll() {\n      renderVocab();\n      renderListenEmoji();\n      renderStory();\n      renderReadQ();\n      renderSpeak();\n      renderFill();\n      renderGrammarQ();\n      renderExtra();\n      updateCertificate();\n    }\n\n    document.querySelectorAll('.avatar-btn').forEach((btn) => {\n      btn.onclick = () => {\n        document.querySelectorAll('.avatar-btn').forEach(b => b.className = 'avatar-btn text-2xl py-1.5 rounded-2xl border-4 border-slate-200 bg-white hover:bg-slate-50 transition');\n        btn.className = 'avatar-btn text-2xl py-1.5 rounded-2xl border-4 border-sky-500 bg-sky-50 transition';\n        state.avatar = btn.dataset.avatar;\n      };\n    });\n\n    buildUnitMenus();\n  <\/script>\n<\/body>\n<\/html>\n", "g3practice": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, user-scalable=no\">\n  <title>Grade 3 English Quest<\/title>\n  <!-- Tailwind CSS -->\n  <script src=\"https://cdn.tailwindcss.com\"><\/script>\n  <!-- Google Fonts: Fredoka & Nunito -->\n  <link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n  <link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n  <link href=\"https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap\" rel=\"stylesheet\">\n\n  <script>\n    tailwind.config = {\n      theme: {\n        extend: {\n          fontFamily: {\n            sans: ['Nunito', 'sans-serif'],\n            display: ['Fredoka', 'sans-serif'],\n          },\n          colors: {\n            brand: {\n              50: '#eef2ff',\n              100: '#e0e7ff',\n              500: '#4f46e5',\n              600: '#4338ca',\n              success: '#10b981',\n              accent: '#f59e0b',\n              coral: '#f43f5e'\n            }\n          },\n          boxShadow: {\n            'fun': '0 6px 0px rgba(0,0,0,0.06), 0 12px 20px rgba(0,0,0,0.05)',\n            'card-pop': '0 10px 25px -5px rgba(79, 70, 229, 0.2), 0 8px 10px -6px rgba(79, 70, 229, 0.15)'\n          }\n        }\n      }\n    }\n  <\/script>\n\n  <style>\n    * {\n      box-sizing: border-box;\n      user-select: none;\n      -webkit-user-select: none;\n      -webkit-tap-highlight-color: transparent;\n    }\n\n    body {\n      font-family: 'Nunito', sans-serif;\n      background: radial-gradient(circle at 10% 20%, #f0fdf4 0%, #eff6ff 50%, #fdf4ff 100%);\n      color: #1e293b;\n      min-height: 100vh;\n      touch-action: manipulation;\n    }\n\n    .font-display { font-family: 'Fredoka', sans-serif; }\n\n    /* Button 3D Tactile feedback */\n    .btn-3d {\n      transition: all 0.15s ease-out;\n      transform: translateY(0);\n    }\n    .btn-3d:active {\n      transform: translateY(2px);\n    }\n\n    /* Touch & Drag Styling */\n    .card-item {\n      cursor: grab;\n      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;\n      touch-action: manipulation;\n    }\n    .card-item:active {\n      cursor: grabbing;\n      transform: scale(0.98);\n    }\n    .card-item.selected {\n      border-color: #4f46e5 !important;\n      background-color: #e0e7ff !important;\n      transform: translateY(-2px) scale(1.02);\n      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.35), 0 10px 20px -5px rgba(79, 70, 229, 0.25);\n    }\n    .card-item.dragging {\n      opacity: 0.5;\n    }\n\n    .drop-slot {\n      transition: all 0.2s ease;\n    }\n    .drop-slot.hovered {\n      border-color: #4f46e5 !important;\n      background-color: #e0e7ff !important;\n      transform: scale(1.02);\n    }\n    .drop-slot.correct {\n      border-color: #10b981 !important;\n      background-color: #ecfdf5 !important;\n    }\n\n    /* Floating Point Bubbles */\n    .point-float {\n      position: fixed;\n      pointer-events: none;\n      z-index: 9999;\n      font-family: 'Fredoka', sans-serif;\n      font-weight: 700;\n      color: #f59e0b;\n      text-shadow: 0 2px 4px rgba(0,0,0,0.15), 0 0 12px rgba(245, 158, 11, 0.5);\n      animation: floatUp 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;\n    }\n\n    @keyframes floatUp {\n      0% { opacity: 0 f (AudioCtxClass) {\n          try {\n            audioCtx = new AudioCtxClass();\n          } catch (e) {\n            console.warn('AudioContext creation waiting for interaction', e);\n          }\n        }\n      }\n      if (audioCtx && audioCtx.state === 'suspended') {\n        try { audioCtx.resume(); } catch (e) {}\n      }\n      return audioCtx;\n    }\n\n    function playTone(freq, type, duration, delay = 0) {\n      if (!AppState.soundEnabled) return;\n      setTimeout(() => {\n        try {\n          const ctx = getAudioContext();\n          if (!ctx) return;\n          const osc = ctx.createOscillator();\n          const gain = ctx.createGain();\n          osc.type = type;\n          osc.frequency.setValueAtTime(freq, ctx.currentTime);\n          gain.gain.setValueAtTime(0.12, ctx.currentTime);\n          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);\n          osc.connect(gain);\n          gain.connect(ctx.destination);\n          osc.start();\n          osc.stop(ctx.currentTime + duration);\n        } catch (e) {\n          console.warn(\"Audio Context waiting for interaction\", e);\n        }\n      }, delay);\n    }\n\n    function soundSuccess() {\n      playTone(523.25, 'sine', 0.15, 0);   // C5\n      playTone(659.25, 'sine', 0.15, 120); // E5\n      playTone(783.99, 'sine', 0.25, 240); // G5\n    }\n\n    function soundError() {\n      playTone(180, 'square', 0.25, 0);\n      playTone(140, 'square', 0.35, 150);\n    }\n\n    function soundFanfare() {\n      playTone(523.25, 'triangle', 0.2, 0);\n      playTone(659.25, 'triangle', 0.2, 100);\n      playTone(783.99, 'triangle', 0.2, 200);\n      playTone(1046.50, 'triangle', 0.5, 300);\n    }\n\n    function soundClick() {\n      playTone(880, 'sine', 0.05, 0);\n    }\n\n    /* ==========================================================================\n       3. MICROSOFT MULTILINGUAL TTS PIPELINE\n       ========================================================================== */\n    let cachedVoices = [];\n\n    function initSpeechVoices() {\n      if (!('speechSynthesis' in window)) return;\n      const synth = window.speechSynthesis;\n\n      function populateVoices() {\n        cachedVoices = synth.getVoices();\n        const voiceSelect = document.getElementById('voice-select');\n        if (!voiceSelect) return;\n\n        voiceSelect.innerHTML = '';\n        const enVoices = cachedVoices.filter(v => v.lang.startsWith('en'));\n\n        if (enVoices.length === 0) {\n          const opt = document.createElement('option');\n          opt.value = 'default';\n          opt.textContent = 'Default Voice';\n          voiceSelect.appendChild(opt);\n          return;\n        }\n\n        enVoices.sort((a, b) => {\n          const aIsMs = a.name.includes('Microsoft') || a.name.includes('Andrew') || a.name.includes('Brian') || a.name.includes('Emma');\n          const bIsMs = b.name.includes('Microsoft') || b.name.includes('Andrew') || b.name.includes('Brian') || b.name.includes('Emma');\n          if (aIsMs && !bIsMs) return -1;\n          if (!aIsMs && bIsMs) return 1;\n          return a.name.localeCompare(b.name);\n        });\n\n        enVoices.forEach(voice => {\n          const opt = document.createElement('option');\n          opt.value = voice.name;\n          let label = voice.name;\n          if (label.includes('Microsoft')) label = '🎙️ ' + label.replace('Microsoft', 'MS');\n          else label = '🗣️ ' + label;\n          opt.textContent = label;\n          voiceSelect.appendChild(opt);\n        });\n\n        const preferred = enVoices.find(v => \n          v.name.includes(\"Andrew\") || \n          v.name.includes(\"Brian\") || \n          v.name.includes(\"Emma\") ||\n          (v.name.includes(\"Multilingual\") && v.lang.startsWith(\"en\"))\n        ) || enVoices[0];\n\n        if (preferred) {\n          AppState.activeVoice = preferred;\n          voiceSelect.value = preferred.name;\n        }\n      }\n\n      populateVoices();\n      if (synth.onvoiceschanged !== undefined) {\n        synth.onvoiceschanged = populateVoices;\n      }\n\n      document.getElementById('voice-select').addEventListener('change', (e) => {\n        const chosen = cachedVoices.find(v => v.name === e.target.value);\n        if (chosen) {\n          AppState.activeVoice = chosen;\n          speakText(\"Hello \" + AppState.playerName);\n        }\n      });\n    }\n\n    function speakText(text) {\n      if (!('speechSynthesis' in window)) return;\n      window.speechSynthesis.cancel();\n\n      const cleaned = text\n        .replace(/[_|]/g, ' ')\n        .replace(/[\\u{1F300}-\\u{1F9FF}]|[\\u{2600}-\\u{26FF}]|[\\u{2700}-\\u{27BF}]/gu, '')\n        .trim();\n\n      if (!cleaned) return;\n\n      const utterance = new SpeechSynthesisUtterance(cleaned);\n      utterance.rate = AppState.slowVoice ? 0.85 : 0.98;\n      utterance.pitch = 1.0;\n\n      if (AppState.activeVoice) {\n        utterance.voice = AppState.activeVoice;\n      } else if (cachedVoices.length > 0) {\n        const msVoice = cachedVoices.find(v => \n          v.name.includes(\"Andrew\") || \n          v.name.includes(\"Brian\") || \n          v.name.includes(\"Emma\") ||\n          (v.name.includes(\"Multilingual\") && v.lang.startsWith(\"en\"))\n        ) || cachedVoices.find(v => v.lang.startsWith(\"en\"));\n        if (msVoice) utterance.voice = msVoice;\n      }\n\n      window.speechSynthesis.speak(utterance);\n    }\n\n    /* ==========================================================================\n       4. GENTLE 2D CANVAS CONFETTI (Subdued, 15 particles)\n       ========================================================================== */\n    const confettiCanvas = document.getElementById('confetti-canvas');\n    const confettiCtx = confettiCanvas ? confettiCanvas.getContext('2d') : null;\n    let confettiParticles = [];\n\n    function resizeCanvas() {\n      if (confettiCanvas) {\n        confettiCanvas.width = window.innerWidth;\n        confettiCanvas.height = window.innerHeight;\n      }\n    }\n    window.addEventListener('resize', resizeCanvas);\n    resizeCanvas();\n\n    function triggerConfetti(originX, originY) {\n      if (!confettiCanvas) return;\n      const colors = ['#4f46e5', '#10b981', '#f59e0b', '#ec4899', '#3b82f6'];\n      const x = originX || confettiCanvas.width / 2;\n      const y = originY || confettiCanvas.height / 2;\n\n      for (let i = 0; i < 15; i++) {\n        confettiParticles.push({\n          x: x,\n          y: y,\n          vx: (Math.random() - 0.5) * 8,\n          vy: (Math.random() - 0.6) * 10,\n          size: Math.random() * 5 + 3,\n          color: colors[Math.floor(Math.random() * colors.length)],\n          rotation: Math.random() * 360,\n          vRot: (Math.random() - 0.5) * 6,\n          alpha: 1\n        });\n      }\n      if (confettiParticles.length <= 15) animateConfetti();\n    }\n\n    function animateConfetti() {\n      if (!confettiCtx || !confettiCanvas) return;\n      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);\n      confettiParticles.forEach((p, idx) => {\n        p.x += p.vx;\n        p.y += p.vy;\n        p.vy += 0.3;\n        p.rotation += p.vRot;\n        p.alpha -= 0.02;\n\n        confettiCtx.save();\n        confettiCtx.globalAlpha = Math.max(p.alpha, 0);\n        confettiCtx.translate(p.x, p.y);\n        confettiCtx.rotate((p.rotation * Math.PI) / 180);\n        confettiCtx.fillStyle = p.color;\n        confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);\n        confettiCtx.restore();\n\n        if (p.alpha <= 0) confettiParticles.splice(idx, 1);\n      });\n\n      if (confettiParticles.length > 0) requestAnimationFrame(animateConfetti);\n      else confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);\n    }\n\n    /* ==========================================================================\n       5. REWARDS & XP PROGRESSION\n       ========================================================================== */\n    function triggerPoints(points, x, y) {\n      AppState.points += points;\n      AppState.streak += 1;\n      if (AppState.streak > AppState.maxStreak) AppState.maxStreak = AppState.streak;\n\n      const floatEl = document.createElement('div');\n      floatEl.className = 'point-float';\n      floatEl.innerText = '+' + points + ' XP ⭐';\n      const posX = x || (window.innerWidth / 2);\n      const posY = y || (window.innerHeight / 3);\n      floatEl.style.left = posX + 'px';\n      floatEl.style.top = posY + 'px';\n      document.body.appendChild(floatEl);\n\n      setTimeout(() => floatEl.remove(), 1200);\n\n      soundSuccess();\n      triggerConfetti(posX, posY);\n\n      if (AppState.streak === 3) unlockBadge('streak_3');\n\n      checkLevelUp();\n      updateUI();\n      saveProfile();\n    }\n\n    function checkLevelUp() {\n      let currentLvl = 1;\n      for (let i = 0; i < LevelThresholds.length; i++) {\n        if (AppState.points >= LevelThresholds[i].xp) {\n          currentLvl = LevelThresholds[i].level + 1;\n        }\n      }\n      if (currentLvl > 5) currentLvl = 5;\n\n      if (currentLvl > AppState.level) {\n        AppState.level = currentLvl;\n        soundFanfare();\n        triggerConfetti(window.innerWidth / 2, window.innerHeight * 0.4);\n      }\n    }\n\n    function unlockBadge(badgeId) {\n      if (!AppState.unlockedBadges.has(badgeId)) {\n        AppState.unlockedBadges.add(badgeId);\n        soundFanfare();\n        triggerConfetti(window.innerWidth / 2, window.innerHeight * 0.4);\n        saveProfile();\n        updateUI();\n      }\n    }\n\n    function updateUI() {\n      document.getElementById('player-name-display').innerText = AppState.playerName || 'Player';\n      document.getElementById('hero-player-name').innerText = AppState.playerName || 'Player';\n      document.getElementById('player-avatar-badge').innerText = AppState.playerAvatar;\n      document.getElementById('points-counter').innerText = AppState.points;\n      document.getElementById('streak-counter').innerText = AppState.streak;\n      document.getElementById('badge-count-display').innerText = AppState.unlockedBadges.size + '/' + BadgesData.length;\n\n      const prevXp = AppState.level === 1 ? 0 : LevelThresholds[AppState.level - 2].xp;\n      const nextXp = LevelThresholds[Math.min(AppState.level - 1, LevelThresholds.length - 1)].xp;\n      const range = nextXp - prevXp;\n      const progress = Math.min(Math.max((AppState.points - prevXp) / range, 0), 1) * 100;\n      document.getElementById('xp-progress-bar').style.width = progress + '%';\n    }\n\n    /* ==========================================================================\n       6. LEARNING GUIDES METADATA\n       ========================================================================== */\n    const Curricula = {\n      'simple-present': {\n        id: 'simple-present',\n        badgeId: 'present_master',\n        icon: '⏰',\n        title: 'Simple Present Tense',\n        learnContent: {\n          concept: 'Daily Habits & Routines ⏰',\n          formula: '👉 Do / Does + Subject + Verb?<br>👉 Yes, I do. / Yes, he does.',\n          interactiveCards: [\n            { title: 'Habits', example: 'I brush my teeth every day. 🪥', audio: 'I brush my teeth every day.' },\n            { title: 'He / She (-s)', example: 'She plays the piano. 🎹', audio: 'She plays the piano.' },\n            { title: 'Questions', example: 'Do you like bananas? Yes, I do! 🍌', audio: 'Do you like bananas? Yes, I do!' }\n          ]\n        }\n      },\n      'present-continuous': {\n        id: 'present-continuous',\n        badgeId: 'action_champ',\n        icon: '⚡',\n        title: 'Present Continuous',\n        learnContent: {\n          concept: 'Actions Happening Right Now ⚡',\n          formula: '👉 Subject + [ is / am / are ] + Verb-ing<br>👉 What are you doing? ➔ I am reading. 📖',\n          interactiveCards: [\n            { title: 'I am', example: 'I am drawing a picture! 🎨', audio: 'I am drawing a picture!' },\n            { title: 'He is', example: 'He is kicking the ball! ⚽', audio: 'He is kicking the ball!' },\n            { title: 'They are', example: 'They are swimming in the pool! 🏊‍♂️', audio: 'They are swimming in the pool!' }\n          ]\n        }\n      },\n      'simple-past': {\n        id: 'simple-past',\n        badgeId: 'past_master',\n        icon: '🕰️',\n        title: 'Simple Past Tense',\n        learnContent: {\n          concept: 'Actions Completed in the Past 🕰️',\n          formula: '👉 Did + Subject + Verb? (e.g. Did you play? ⚽)<br>👉 Yes, I played! / I saw, went, ate.',\n          interactiveCards: [\n            { title: 'Regular (-ed)', example: 'We played soccer yesterday. ⚽', audio: 'We played soccer yesterday.' },\n            { title: 'Irregular Verbs', example: 'I saw elephants and went to the zoo. 🦁', audio: 'I saw elephants and went to the zoo.' },\n            { title: 'Questions with Did', example: 'Did you visit grandma? Yes, I did! 👵', audio: 'Did you visit grandma? Yes, I did!' }\n          ]\n        }\n      },\n      'vocab-match': {\n        id: 'vocab-match',\n        badgeId: 'vocab_whiz',\n        icon: '🦁',\n        title: 'Emoji Vocabulary',\n        learnContent: {\n          concept: 'Vocabulary Cards 🦁',\n          formula: '👉 Tap each card to hear pronunciation',\n          interactiveCards: [\n            { title: 'Animals', example: 'Elephant 🐘 & Giraffe 🦒', audio: 'Elephant and Giraffe.' },\n            { title: 'Daily Tools', example: 'Backpack 🎒 & Toothbrush 🪥', audio: 'Backpack and Toothbrush.' },\n            { title: 'Music & Sports', example: 'Guitar 🎸 & Basketball 🏀', audio: 'Guitar and Basketball.' }\n          ]\n        }\n      }\n    };\n\n    /* ==========================================================================\n       7. UNIFIED 5-PAIR 10-ROUND MATCHING ENGINE (No Scrolling, Large Fonts)\n       ========================================================================== */\n    function getTopicRoundData(topicId) {\n      if (topicId === 'simple-present') return { rounds: SimplePresentRoundsData, currentRound: AppState.simplePresentRound, badgeId: 'present_master', title: 'Simple Present Tense' };\n      if (topicId === 'present-continuous') return { rounds: PresentContinuousRoundsData, currentRound: AppState.presentContinuousRound, badgeId: 'action_champ', title: 'Present Continuous' };\n      if (topicId === 'simple-past') return { rounds: SimplePastRoundsData, currentRound: AppState.simplePastRound, badgeId: 'past_master', title: 'Simple Past Tense' };\n      if (topicId === 'vocab-match') return { rounds: VocabRoundsData, currentRound: AppState.vocabRound, badgeId: 'vocab_whiz', title: 'Emoji Vocabulary' };\n      return null;\n    }\n\n    function setTopicRoundIndex(topicId, newRound) {\n      if (topicId === 'simple-present') AppState.simplePresentRound = newRound;\n      else if (topicId === 'present-continuous') AppState.presentContinuousRound = newRound;\n      else if (topicId === 'simple-past') AppState.simplePastRound = newRound;\n      else if (topicId === 'vocab-match') AppState.vocabRound = newRound;\n    }\n\n    function toggleTopicRound(topicId, delta) {\n      const topicInfo = getTopicRoundData(topicId);\n      if (!topicInfo) return;\n      let nextRnd = topicInfo.currentRound + delta;\n      if (nextRnd < 0) nextRnd = topicInfo.rounds.length - 1;\n      if (nextRnd >= topicInfo.rounds.length) nextRnd = 0;\n      setTopicRoundIndex(topicId, nextRnd);\n      AppState.selectedCard = null;\n      AppState.matchedPairsCount = 0;\n      renderCurrentTopic();\n      soundClick();\n    }\n\n    function renderRoundMatchingPractice(topicId) {\n      const topicInfo = getTopicRoundData(topicId);\n      if (!topicInfo) return;\n\n      const roundPairs = topicInfo.rounds[topicInfo.currentRound];\n      const mount = document.getElementById('game-content-mount');\n\n      document.getElementById('game-progress-count').innerHTML = `\n        <div class=\"flex items-center justify-between w-full\">\n          <button onclick=\"toggleTopicRound('${topicId}', -1)\" class=\"bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-2.5 py-1 rounded-lg transition btn-3d\">\n            ◀ Prev Round\n          <\/button>\n          <span class=\"font-display font-black text-sm text-indigo-950\">Round ${topicInfo.currentRound + 1} of 10 (Matched ${AppState.matchedPairsCount}/5)<\/span>\n          <button onclick=\"toggleTopicRound('${topicId}', 1)\" class=\"bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-2.5 py-1 rounded-lg transition btn-3d\">\n            Next Round ▶\n          <\/button>\n        <\/div>\n      `;\n\n      mount.innerHTML = '';\n\n      const leftItems = [...roundPairs];\n      const rightItems = [...roundPairs].sort(() => Math.random() - 0.5);\n\n      const grid = document.createElement('div');\n      grid.className = 'grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 items-start w-full';\n\n      // Left Column (5 Prompts)\n      const leftCol = document.createElement('div');\n      leftCol.className = 'space-y-3 w-full';\n      const leftH = document.createElement('h5');\n      leftH.className = 'font-display font-black text-sm md:text-base text-indigo-900 uppercase tracking-wider mb-2 flex items-center gap-1.5';\n      leftH.innerHTML = `<span>❓<\/span> Prompts (5 Pairs)`;\n      leftCol.appendChild(leftH);\n\n      leftItems.forEach(item => {\n        const card = document.createElement('div');\n        card.id = `left-${item.id}`;\n        card.dataset.pairId = item.id;\n        card.draggable = true;\n        card.className = 'card-item bg-white border-2 border-indigo-200 hover:border-indigo-500 rounded-2xl p-4 md:p-4.5 shadow-xs flex items-center gap-3 transition cursor-pointer';\n\n        const span = document.createElement('span');\n        span.className = 'font-bold text-lg md:text-xl lg:text-2xl text-slate-800 leading-snug flex-1';\n        span.innerText = item.left.text;\n\n        card.appendChild(span);\n\n        card.onclick = () => {\n          speakText(item.left.audio);\n          handleCardSelect(card);\n        };\n\n        card.ondragstart = (e) => {\n          e.dataTransfer.setData('text/plain', item.id);\n          card.classList.add('dragging');\n          speakText(item.left.audio);\n        };\n        card.ondragend = () => card.classList.remove('dragging');\n\n        leftCol.appendChild(card);\n      });\n\n      // Right Column (5 Targets)\n      const rightCol = document.createElement('div');\n      rightCol.className = 'space-y-3 w-full';\n      const rightH = document.createElement('h5');\n      rightH.className = 'font-display font-black text-sm md:text-base text-emerald-900 uppercase tracking-wider mb-2 flex items-center gap-1.5';\n      rightH.innerHTML = `<span>🎯<\/span> Targets`;\n      rightCol.appendChild(rightH);\n\n      rightItems.forEach(item => {\n        const target = document.createElement('div');\n        target.id = `right-${item.id}`;\n        target.dataset.pairId = item.id;\n        target.className = 'drop-slot bg-slate-50 border-2 border-dashed border-slate-300 hover:border-emerald-400 rounded-2xl p-4 md:p-4.5 shadow-xs flex items-center gap-3 transition cursor-pointer';\n\n        const span = document.createElement('span');\n        span.className = 'font-bold text-lg md:text-xl lg:text-2xl text-slate-700 leading-snug flex-1';\n        span.innerText = item.right.text;\n\n        target.appendChild(span);\n\n        target.onclick = () => {\n          if (AppState.selectedCard) {\n            handleRoundDropEvaluation(AppState.selectedCard, target, topicId, roundPairs, topicInfo);\n          } else {\n            speakText(item.right.audio);\n          }\n        };\n\n        target.ondragover = (e) => {\n          e.preventDefault();\n          target.classList.add('hovered');\n        };\n        target.ondragleave = () => target.classList.remove('hovered');\n        target.ondrop = (e) => {\n          e.preventDefault();\n          target.classList.remove('hovered');\n          const draggedId = e.dataTransfer.getData('text/plain');\n          const draggedCard = document.getElementById(`left-${draggedId}`);\n          if (draggedCard) handleRoundDropEvaluation(draggedCard, target, topicId, roundPairs, topicInfo);\n        };\n\n        rightCol.appendChild(target);\n      });\n\n      grid.appendChild(leftCol);\n      grid.appendChild(rightCol);\n      mount.appendChild(grid);\n    }\n\n    function handleCardSelect(card) {\n      soundClick();\n      if (card.classList.contains('pointer-events-none')) return;\n\n      document.querySelectorAll('.card-item').forEach(el => el.classList.remove('selected'));\n\n      if (AppState.selectedCard === card) {\n        AppState.selectedCard = null;\n        return;\n      }\n\n      AppState.selectedCard = card;\n      card.classList.add('selected');\n    }\n\n    function handleRoundDropEvaluation(card, target, topicId, roundPairs, topicInfo) {\n      if (target.classList.contains('correct')) return;\n\n      const cardId = card.dataset.pairId;\n      const targetId = target.dataset.pairId;\n      const rect = target.getBoundingClientRect();\n\n      if (cardId === targetId) {\n        triggerPoints(50, rect.left + rect.width / 2, rect.top + rect.height / 2);\n        unlockBadge('first_match');\n\n        card.classList.remove('selected');\n        card.classList.add('opacity-40', 'bg-emerald-50', 'border-emerald-300', 'pointer-events-none');\n        card.draggable = false;\n\n        target.classList.remove('border-dashed');\n        target.classList.add('correct', 'border-emerald-500', 'bg-emerald-100', 'pointer-events-none');\n\n        AppState.selectedCard = null;\n        AppState.matchedPairsCount += 1;\n\n        document.getElementById('game-progress-count').innerHTML = `\n          <div class=\"flex items-center justify-between w-full\">\n            <button onclick=\"toggleTopicRound('${topicId}', -1)\" class=\"bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-2.5 py-1 rounded-lg transition btn-3d\">\n              ◀ Prev Round\n            <\/button>\n            <span class=\"font-display font-black text-sm text-indigo-950\">Round ${topicInfo.currentRound + 1} of 10 (Matched ${AppState.matchedPairsCount}/5)<\/span>\n            <button onclick=\"toggleTopicRound('${topicId}', 1)\" class=\"bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs px-2.5 py-1 rounded-lg transition btn-3d\">\n              Next Round ▶\n            <\/button>\n          <\/div>\n        `;\n\n        if (AppState.matchedPairsCount >= roundPairs.length) {\n          AppState.matchedPairsCount = 0;\n          AppState.selectedCard = null;\n          if (topicInfo.currentRound >= topicInfo.rounds.length - 1) {\n            unlockBadge(topicInfo.badgeId);\n            setTimeout(() => showVictoryModal(`${topicInfo.title} (All 10 Rounds Mastered!)`, 400), 600);\n          } else {\n            setTimeout(() => {\n              setTopicRoundIndex(topicId, topicInfo.currentRound + 1);\n              AppState.selectedCard = null;\n              AppState.matchedPairsCount = 0;\n              renderRoundMatchingPractice(topicId);\n            }, 800);\n          }\n        }\n      } else {\n        soundError();\n        AppState.streak = 0;\n        updateUI();\n\n        card.classList.add('border-rose-500', 'bg-rose-50');\n        setTimeout(() => {\n          card.classList.remove('border-rose-500', 'bg-rose-50', 'selected');\n          AppState.selectedCard = null;\n        }, 400);\n      }\n    }\n\n    function renderLearnView(config) {\n      document.getElementById('game-progress-count').innerText = '📚 Learn Mode';\n      const mount = document.getElementById('game-content-mount');\n      const learn = config.learnContent;\n\n      mount.innerHTML = `\n        <div class=\"space-y-6 max-w-4xl mx-auto w-full\">\n          <div class=\"bg-gradient-to-r from-indigo-500 via-indigo-600 to-purple-600 rounded-3xl p-6 text-white shadow-fun flex flex-col md:flex-row items-center justify-between gap-4 cursor-pointer\" onclick=\"speakText('${learn.concept}')\">\n            <h4 class=\"font-display font-black text-2xl md:text-4xl text-center md:text-left\">${learn.concept}<\/h4>\n            <span class=\"bg-amber-400 text-amber-950 font-bold text-sm px-4 py-2 rounded-xl shadow transition\">\n              Tap to Listen\n            <\/span>\n          <\/div>\n\n          <div class=\"bg-amber-50 border-2 border-amber-300 rounded-2xl p-5 text-center\">\n            <div class=\"font-mono text-base md:text-xl font-bold text-slate-800 leading-relaxed\">${learn.formula}<\/div>\n          <\/div>\n\n          <div class=\"grid grid-cols-1 md:grid-cols-3 gap-4\">\n            ${learn.interactiveCards.map(c => `\n              <div class=\"bg-white border-2 border-indigo-100 hover:border-indigo-500 rounded-2xl p-5 shadow-xs transition flex flex-col justify-between cursor-pointer\" onclick=\"speakText('${c.audio}')\">\n                <div>\n                  <h5 class=\"font-display font-bold text-lg md:text-xl text-indigo-900 mb-2 flex items-center gap-2\">\n                    <span>💡<\/span> ${c.title}\n                  <\/h5>\n                  <p class=\"text-base md:text-lg text-slate-800 font-bold leading-relaxed mb-4\">${c.example}<\/p>\n                <\/div>\n                <div class=\"text-xs font-bold text-indigo-600 bg-indigo-50 py-1.5 px-3 rounded-lg text-center\">\n                  Touch to Hear\n                <\/div>\n              <\/div>\n            `).join('')}\n          <\/div>\n\n          <div class=\"pt-2 text-center\">\n            <button onclick=\"switchTopicMode('practice')\" class=\"bg-emerald-600 hover:bg-emerald-700 text-white font-display font-bold text-lg px-8 py-3.5 rounded-2xl shadow transition btn-3d inline-flex items-center gap-2\">\n              <span>🎮<\/span> Start Practice (5 Pairs / 10 Rounds)\n            <\/button>\n          <\/div>\n        <\/div>\n      `;\n    }\n\n    /* -------------------------------------------------------------\n       8. Time & Tense Decider View (20 Questions)\n       ------------------------------------------------------------- */\n    function renderTenseTimeDecider(mode) {\n      const mount = document.getElementById('game-content-mount');\n\n      if (mode === 'learn') {\n        document.getElementById('game-progress-count').innerText = '⏳ Time Clues Guide';\n\n        mount.innerHTML = `\n          <div class=\"space-y-5 max-w-3xl mx-auto w-full\">\n            <div class=\"bg-gradient-to-r from-amber-500 via-orange-500 to-rose-500 rounded-3xl p-5 text-white shadow-fun flex flex-col md:flex-row items-center justify-between gap-4 cursor-pointer\" onclick=\"speakText('How to choose the correct tense using time clues!')\">\n              <div class=\"flex items-center gap-3\">\n                <span class=\"text-5xl\">⏳<\/span>\n                <div>\n                  <h4 class=\"font-display font-black text-2xl md:text-3xl\">Time & Tense Secret<\/h4>\n                  <p class=\"text-sm font-bold text-amber-100\">Look at the TIME CLUE to decide which verb tense to use!<\/p>\n                <\/div>\n              <\/div>\n            <\/div>\n\n            <div class=\"grid grid-cols-1 md:grid-cols-2 gap-4\">\n              <div class=\"bg-white border-2 border-amber-300 rounded-2xl p-5 shadow-xs cursor-pointer hover:border-amber-500 transition\" onclick=\"speakText('Simple present is for habits and routines. Every day, always, usually, on Sundays.')\">\n                <span class=\"text-xs uppercase font-black bg-amber-100 text-amber-900 px-2.5 py-1 rounded-full mb-2 inline-block\">⏰ Routine / Habit<\/span>\n                <h5 class=\"font-display font-black text-xl t x-8 py-3 rounded-2xl shadow transition btn-3d inline-flex items-center gap-2\">\n                <span>🎮<\/span> Play 20 Time Clue Challenges\n              <\/button>\n            <\/div>\n          <\/div>\n        `;\n      } else {\n        const q = TenseTimeQuestions[currentTenseQuestionIndex];\n        document.getElementById('game-progress-count').innerText = `Question ${currentTenseQuestionIndex + 1} of ${TenseTimeQuestions.length}`;\n\n        const choices = Math.random() > 0.5 \n          ? [q.correctChoice, q.wrongChoice] \n          : [q.wrongChoice, q.correctChoice];\n\n        mount.innerHTML = `\n          <div class=\"max-w-2xl mx-auto w-full space-y-5 text-center\">\n            <div class=\"inline-flex items-center gap-2 bg-amber-100 text-amber-900 px-4 py-1.5 rounded-full font-bold text-sm shadow-xs border border-amber-300 animate-pulse\">\n              <span>⏳ Time Clue:<\/span>\n              <span class=\"font-black underline\">${q.timeClue}<\/span>\n            <\/div>\n\n            <div class=\"bg-white border-2 border-indigo-200 hover:border-indigo-400 rounded-3xl p-6 shadow-sm cursor-pointer transition\" onclick=\"speakText('${q.sentence.replace(/__________/g, 'blank')}')\">\n              <p class=\"font-display font-black text-xl md:text-3xl text-slate-900 leading-relaxed\">\n                ${q.sentence}\n              <\/p>\n              <span class=\"text-xs font-bold text-indigo-500 mt-2 block\">Touch sentence to hear<\/span>\n            <\/div>\n\n            <div class=\"grid grid-cols-1 sm:grid-cols-2 gap-4 pt-2\">\n              ${choices.map(c => `\n                <button class=\"choice-tense-btn bg-white border-3 border-indigo-200 hover:border-indigo-600 hover:bg-indigo-50/50 p-5 rounded-3xl shadow-xs transition btn-3d text-center cursor-pointer\" data-choice=\"${c}\">\n                  <span class=\"font-display font-black text-xl md:text-2xl text-slate-800\">${c}<\/span>\n                <\/button>\n              `).jo his.enabled;\n                if (!this.enabled) {\n                    this.utteranceQueue = [];\n                    this.synth.cancel();\n                }\n                return this.enabled;\n            }\n\n            isEnabled() {\n                return this.enabled;\n            }\n        }\n        const speechService = new SpeechService();\n\n\n        // --- UPGRADED AUDIO & SOUND EFFECTS ENGINE ---\n        let audioReady = false;\n        let toneSynth;\n\n        async function initAudio() {\n            if (!audioReady) {\n                await Tone.start();\n                toneSynth = new Tone.PolySynth(Tone.Synth, {\n                    oscillator: { type: \"sine\" },\n                    envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 0.2 }\n                }).toDestination();\n                audioReady = true;\n            }\n        }\n        \n        function playSound(type) {\n            if (!audioReady) return;\n            const now = Tone.now();\n            switch (type) {\n                case 'correct':\n                    toneSynth.triggerAttackRelease([\"C5\", \"E5\", \"G5\"], \"8n\", now);\n                    break;\n                case 'incorrect':\n                    toneSynth.triggerAttackRelease(\"A2\", \"8n\", now);\n                    break;\n                case 'flip':\n                    toneSynth.triggerAttackRelease(\"A4\", \"16n\", now);\n                    break;\n                case 'win':\n                    toneSynth.triggerAttackRelease(\"C4\", \"8n\", now);\n                    toneSynth.triggerAttackRelease(\"E4\", \"8n\", now + 0.1);\n                    toneSynth.triggerAttackRelease(\"G4\", \"8n\", now + 0.2);\n                    toneSynth.triggerAttackRelease(\"C5\", \"8n\", now + 0.3);\n                    break;\n                case 'badge':\n                    toneSynth.triggerAttackRelease([\"C5\", \"G5\", \"C6\"], \"4n\", now);\n                    break;\n            }\n        }\n        \n        document.body.addEventListener('click', initAudio, { once: true });\n\n\n        // --- DATA STRUCTURE ---\n        const praiseWords = [\"Awesome!\", \"Great job!\", \"Excellent!\", \"Well done!\", \"Perfect!\", \"Amazing!\"];\n        const topics = {\n            \"Starter Unit: My family\": { \n                emoji: \"👨‍👩‍👧‍👦\", \n                words: { \"family\": \"👨‍👩‍👧‍👦\", \"grandpa\": \"👴\", \"grandma\": \"👵\", \"mum\": \"👩\", \"dad\": \"👨\", \"happy\": \"😊\", \"sad\": \"😢\", \"thirteen\": \"1️⃣3️⃣\", \"thirty\": \"3️⃣0️⃣\", \"fourteen\": \"1️⃣4️⃣\", \"forty\": \"4️⃣0️⃣\", \"fifteen\": \"1️⃣5️⃣\" }, \n                sentences: [\"My grandpa is kind.\", \"I love my mum.\", \"My family is happy.\", \"The boy is sad.\", \"She is thirteen years old.\", \"My dad is forty years old.\", \"There are fifteen cookies.\", \"I have sixty stickers.\", \"My grandma tells stories.\", \"Count from one to one hundred.\"], \n                questions: [{ q: \"What number is 13?\", a: \"thirteen\" }, { q: \"What number is 30?\", a: \"thirty\" }, { q: \"What number is 14?\", a: \"fourteen\" }, { q: \"What number is 40?\", a: \"forty\" }, { q: \"What number is 15?\", a: \"fifteen\" }, { q: \"What number is 50?\", a: \"fifty\" }, { q: \"What number is 16?\", a: \"sixteen\" }, { q: \"What number is 60?\", a: \"sixty\" }, { q: \"What number is 17?\", a: \"seventeen\" }, { q: \"What number is 70?\", a: \"seventy\" }, { q: \"What number is 18?\", a: \"eighteen\" }, { q: \"What number is 80?\", a: \"eighty\" }, { q: \"What number is 19?\", a: \"nineteen\" }, { q: \"What number is 90?\", a: \"ninety\" }] \n            },\n            \"Unit 1: They're from Australia!\": { \n                emoji: \"🇦🇺\", \n                words: { \"Egypt\": \"🇪🇬\", \"UK\": \"🇬🇧\", \"Russia\": \"🇷🇺\", \"Spain\": \"🇪🇸\", \"Australia\": \"🇦🇺\", \"USA\": \"🇺🇸\", \"Brazil\": \"🇧🇷\", \"spring\": \"🌸\", \"summer\": \"☀️\", \"autumn\": \"🍂\", \"winter\": \"❄️\", \"garden\": \" ood is yellow and sour?\", a: \"lemon\" }, { q: \"Which food comes from Italy?\", a: \"pasta\" }, { q: \"What do you put on a sandwich?\", a: \"cheese\" }, { q: \"What is a young person?\", a: \"child\" }, { q: \"What do you eat in the morning with milk?\", a: \"cereal\" }, { q: \"What do you make toast from?\", a: \"bread\" }, { q: \"What is a big, round, sweet fruit?\", a: \"melon\" }, { q: \"What can you make chips from?\", a: \"potato\" }, { q: \"What do you put on bread?\", a: \"butter\" }, { q: \"What vegetable can make you cry?\", a: \"onion\" }] \n            },\n            \"Unit 9: The fastest animal in the world\": { \n                emoji: \"🐆\", \n                words: { \"lake\": \"🏞️\", \"jungle\": \"🌴\", \"river\": \"💧\", \"waterfall\": \"🌊\", \"ocean\": \"🌎\", \"wide\": \"↔️\", \"big\": \"🐘\", \"deep\": \"🏊‍♂️\", \"high\": \"🔼\", \"building\": \"🏢\", \"bridge\": \"🌉\", \"long\": \"📏\" }, \n                sentences: [\"The mountain is very high.\", \"The cheetah is the fastest animal.\", \"The ocean is deep and wide.\", \"The giraffe is the tallest animal.\", \"The waterfall is beautiful.\", \"We put up a tent on the sand.\", \"The lake is calm today.\", \"The old bridge is very long.\", \"I need a lamp to read.\", \"Many animals live in the jungle.\"], \n                questions: [{q: \"What is very high?\", a: \"mountain\"}, {q: \"What is the fastest animal?\", a: \"cheetah\"}, {q: \"What is a very large body of water?\", a: \"ocean\"}, {q: \"What is a very big forest called?\", a: \"jungle\"}, {q: \"What do you sleep in when you camp?\", a: \"tent\"}, {q: \"What is the opposite of narrow?\", a: \"wide\"}, {q: \"What is the opposite of shallow?\", a: \"deep\"}, {q: \"What goes over a river?\", a: \"bridge\"}, {q: \"What is the opposite of new?\", a: \"old\"}, {q: \"What gives you light?\", a: \"lamp\"}] \n            },\n            \"Unit 10: In the park!\": { \n                emoji: \"🌳\", \n                words: { \"path\": \"🛤️\", \"gras
