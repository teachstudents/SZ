<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESL Daily Performance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Ultra compact checkbox for high density */
        .checkbox-custom {
            width: 0.85rem;
            height: 0.85rem;
            cursor: pointer;
            margin-right: 0.3rem;
        }
        
        /* Reduce table cell padding to decrease row height */
        td {
            padding-top: 0.25rem !important;
            padding-bottom: 0.25rem !important;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-2 md:p-4">

    <div class="w-full max-w-6xl mx-auto bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
        
        <!-- Controls Header -->
        <div class="bg-indigo-700 px-4 py-3 text-white flex flex-wrap gap-3 justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 shadow-sm rounded">
                    <input type="date" id="datePicker" class="px-3 py-1.5 bg-indigo-600/80 text-white rounded border border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-300 text-sm font-medium">
                </div>
                <div class="flex items-center gap-2 shadow-sm rounded">
                    <select id="classSelector" class="px-3 py-1.5 bg-indigo-600/80 text-white rounded border border-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-300 text-sm font-medium cursor-pointer">
                        <!-- Options loaded via JS -->
                    </select>
                </div>
            </div>
            
            <button onclick="exportToCSV()" class="bg-emerald-500 hover:bg-emerald-400 text-white px-4 py-1.5 rounded text-sm font-bold transition flex items-center shadow-md hover:shadow-lg">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                Export CSV
            </button>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse table-fixed min-w-[600px]">
                <colgroup>
                    <col class="w-[15%]"> <!-- Name - Reduced width -->
                    <col class="w-[75%]"> <!-- Positives - Increased width to move left -->
                    <col class="w-[10%]"> <!-- Score -->
                </colgroup>
                <thead class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs uppercase tracking-wider">
                    <tr>
                        <th class="px-3 py-2 font-semibold">Student Name</th>
                        <th class="px-3 py-2 font-semibold">Behaviors & Points</th>
                        <th class="px-3 py-2 font-semibold text-right pr-6">Score</th>
                    </tr>
                </thead>
                <tbody id="studentTableBody" class="text-sm divide-y divide-slate-100">
                    <!-- Rows generated by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const schoolData = {
            "6H2": [
                { en: "Elsa", pinyin: "", zh: "" },
                { en: "Lily", pinyin: "", zh: "" },
                { en: "Florence", pinyin: "", zh: "" },
                { en: "Yao", pinyin: "", zh: "" },
                { en: "Miya", pinyin: "", zh: "" },
                { en: "Nadiia", pinyin: "", zh: "" },
                { en: "Amara", pinyin: "", zh: "" },
                { en: "Hitomi", pinyin: "", zh: "" },
                { en: "Alice", pinyin: "", zh: "" },
                { en: "Karina", pinyin: "", zh: "" },
                { en: "Winnie", pinyin: "", zh: "" },
                { en: "Bella", pinyin: "", zh: "" },
                { en: "Sonia", pinyin: "", zh: "" },
                { en: "Albee", pinyin: "", zh: "" },
                { en: "Abby", pinyin: "", zh: "" },
                { en: "Martin", pinyin: "", zh: "" },
                { en: "Noah", pinyin: "", zh: "" },
                { en: "Eric", pinyin: "", zh: "" },
                { en: "Eden", pinyin: "", zh: "" },
                { en: "Dominic", pinyin: "", zh: "" },
                { en: "Austin", pinyin: "", zh: "" },
                { en: "Charles", pinyin: "", zh: "" },
                { en: "Hoho", pinyin: "", zh: "" },
                { en: "Anders", pinyin: "", zh: "" },
                { en: "Jimmy", pinyin: "", zh: "" },
                { en: "Ming", pinyin: "", zh: "" },
                { en: "Jason", pinyin: "", zh: "" },
                { en: "Brendan", pinyin: "", zh: "" },
                { en: "Charlie", pinyin: "", zh: "" },
                { en: "Sky", pinyin: "", zh: "" },
                { en: "Ryan", pinyin: "", zh: "" },
                { en: "Ian", pinyin: "", zh: "" },
                { en: "Biscuit", pinyin: "", zh: "" }
            ],
            "Grade 5 - 5M2": [
                { en: "Julia", pinyin: "", zh: "" },
                { en: "Freya", pinyin: "", zh: "" },
                { en: "Anna", pinyin: "", zh: "" },
                { en: "Grace", pinyin: "", zh: "" },
                { en: "Avery", pinyin: "", zh: "" },
                { en: "Yihan", pinyin: "", zh: "" },
                { en: "Emma", pinyin: "", zh: "" },
                { en: "Abigail", pinyin: "", zh: "" },
                { en: "Susie", pinyin: "", zh: "" },
                { en: "Nina", pinyin: "", zh: "" },
                { en: "Kenneth", pinyin: "", zh: "" },
                { en: "Dafa", pinyin: "", zh: "" },
                { en: "Jim", pinyin: "", zh: "" },
                { en: "Charles", pinyin: "", zh: "" },
                { en: "Henry", pinyin: "", zh: "" },
                { en: "Patrick", pinyin: "", zh: "" },
                { en: "Ryan", pinyin: "", zh: "" },
                { en: "David", pinyin: "", zh: "" },
                { en: "Justin", pinyin: "", zh: "" },
                { en: "Jason Ma", pinyin: "", zh: "" },
                { en: "Edwin", pinyin: "", zh: "" },
                { en: "Jason Shen", pinyin: "", zh: "" },
                { en: "Terrance", pinyin: "", zh: "" }
            ]
        };

        const behaviors = [
            { id: 'p1', label: 'Strong Participation', points: 1 },
            { id: 'p2', label: 'Organized Desk/Mat.', points: 1 },
            { id: 'p3', label: 'Used Target Vocab', points: 3 },
            { id: 'p4', label: 'Silently Listening', points: 2 }, 
            { id: 'p5', label: 'Answer Qs Correctly', points: 1 },
            { id: 'p6', label: 'Asked Good Qs', points: 2 },
            { id: 'n1', label: 'Disruptive Talking', points: -3 },
            { id: 'n2', label: 'Incomplete HW', points: -3 }
        ];

        const BASE_SCORE = 10;

        const datePicker = document.getElementById('datePicker');
        const classSelector = document.getElementById('classSelector');
        const tableBody = document.getElementById('studentTableBody');

        function init() {
            const today = new Date().toISOString().split('T')[0];
            datePicker.value = today;

            classSelector.innerHTML = '';
            for (const className in schoolData) {
                const option = document.createElement('option');
                option.value = className;
                option.textContent = className;
                classSelector.appendChild(option);
            }

            classSelector.addEventListener('change', renderTable);
            renderTable();
        }

        function renderTable() {
            const selectedClass = classSelector.value;
            const students = schoolData[selectedClass] || [];
            tableBody.innerHTML = '';

            students.forEach((studentObj) => {
                const studentId = studentObj.en.replace(/\s+/g, '-');
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition-colors group';
                
                // 1. Name Column
                const tdName = document.createElement('td');
                tdName.className = 'px-3 py-2 border-r border-slate-100 align-middle bg-white group-hover:bg-slate-50';
                
                // Conditionally render ZH and Pinyin if they exist
                const zhHtml = studentObj.zh ? `<span class="text-[11px] text-slate-500 font-medium ml-1">${studentObj.zh}</span>` : '';
                const pinyinHtml = studentObj.pinyin ? `<div class="text-[10px] text-slate-400 mt-0.5 truncate">${studentObj.pinyin}</div>` : '';
                
                tdName.innerHTML = `
                    <div class="flex flex-col">
                        <div class="flex items-baseline truncate">
                            <span class="font-bold text-slate-700">${studentObj.en}</span>
                            ${zhHtml}
                        </div>
                        ${pinyinHtml}
                    </div>
                `;
                tr.appendChild(tdName);

                // 2. Behaviors (Now spanning the main width, 4 columns x 2 rows to fit positives and negatives)
                const tdPos = document.createElement('td');
                tdPos.className = 'px-3 py-1 border-r border-slate-100 bg-slate-50/40'; 
                tdPos.innerHTML = `<div class="grid grid-cols-4 gap-x-2 gap-y-1">` +  
                    behaviors.map(b => {
                        const isPos = b.points > 0;
                        const ptStr = isPos ? `+${b.points}` : `${b.points}`;
                        const textColor = isPos ? 'text-emerald-500' : 'text-red-500';
                        const hoverColor = isPos ? 'hover:text-emerald-700' : 'hover:text-red-700';
                        const cbClass = isPos ? 'text-emerald-500 focus:ring-emerald-400' : 'text-red-500 focus:ring-red-400';
                        
                        return `
                        <label class="flex items-center text-[11px] text-slate-600 ${hoverColor} cursor-pointer whitespace-nowrap overflow-hidden transition-colors">
                            <input type="checkbox" class="checkbox-custom ${cbClass} border-slate-300 rounded behavior-cb" 
                                data-points="${b.points}" data-label="${b.label}" data-student="${studentId}">
                            <span class="truncate select-none"><span class="${textColor} font-semibold mr-1">${ptStr}</span>${b.label}</span>
                        </label>
                        `;
                    }).join('') + `</div>`;
                tr.appendChild(tdPos);

                // 3. Score Column
                const tdScore = document.createElement('td');
                tdScore.className = 'px-3 py-1 align-middle text-right pr-6'; // Reduced py-2 to py-1
                tdScore.innerHTML = `<span class="inline-flex items-center justify-center min-w-[2rem] h-6 px-2 text-sm font-bold rounded bg-slate-100 text-slate-600 border border-slate-200 score-display transition-all" id="score-${studentId}">${BASE_SCORE}</span>`; // Reduced h-8 to h-6
                tr.appendChild(tdScore);

                tableBody.appendChild(tr);
            });

            // Re-attach event listeners
            document.querySelectorAll('.behavior-cb').forEach(cb => {
                cb.addEventListener('change', calculateScores);
            });
        }

        function calculateScores() {
            const selectedClass = classSelector.value;
            const students = schoolData[selectedClass] || [];

            students.forEach(studentObj => {
                const studentId = studentObj.en.replace(/\s+/g, '-');
                let currentScore = BASE_SCORE;
                const checkboxes = document.querySelectorAll(`input[data-student="${studentId}"]:checked`);
                
                checkboxes.forEach(box => {
                    currentScore += parseInt(box.dataset.points);
                });

                const scoreDisplay = document.getElementById(`score-${studentId}`);
                if (scoreDisplay) {
                    scoreDisplay.textContent = currentScore;
                    
                    if (currentScore > BASE_SCORE) {
                        scoreDisplay.className = "inline-flex items-center justify-center min-w-[2rem] h-6 px-2 text-sm font-bold rounded bg-emerald-500 text-white border border-emerald-600 score-display shadow-sm transition-all"; // Reduced h-8 to h-6
                    } else if (currentScore < BASE_SCORE) {
                        scoreDisplay.className = "inline-flex items-center justify-center min-w-[2rem] h-6 px-2 text-sm font-bold rounded bg-red-500 text-white border border-red-600 score-display shadow-sm transition-all"; // Reduced h-8 to h-6
                    } else {
                        scoreDisplay.className = "inline-flex items-center justify-center min-w-[2rem] h-6 px-2 text-sm font-bold rounded bg-slate-100 text-slate-600 border border-slate-200 score-display transition-all"; // Reduced h-8 to h-6
                    }
                }
            });
        }

        function exportToCSV() {
            const date = datePicker.value;
            const selectedClass = classSelector.value;
            const students = schoolData[selectedClass] || [];
            
            let csvContent = "Date,Class,English Name,Base Score,Final Score,Behaviors Logged\n";

            students.forEach(studentObj => {
                const studentId = studentObj.en.replace(/\s+/g, '-');
                let currentScore = BASE_SCORE;
                let loggedBehaviors = [];
                
                const checkboxes = document.querySelectorAll(`input[data-student="${studentId}"]:checked`);
                checkboxes.forEach(box => {
                    currentScore += parseInt(box.dataset.points);
                    loggedBehaviors.push(box.dataset.label);
                });

                const behaviorsString = `"${loggedBehaviors.join(', ')}"`;
                // Included only English name for export since pinyin/zh are unused right now.
                csvContent += `${date},${selectedClass},${studentObj.en},${BASE_SCORE},${currentScore},${behaviorsString}\n`;
            });

            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `Performance_${selectedClass.replace(/\s+/g, '')}_${date}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Run
        init();
    </script>
</body>
</html>
