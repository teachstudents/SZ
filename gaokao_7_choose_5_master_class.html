<script>
// ============ AUDIO SYSTEM ============
let soundEnabled = true;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, duration, type = 'sine', volume = 0.3) {
  if (!soundEnabled) return;
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.frequency.value = freq;
    osc.type = type;
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playCorrectSound() {
  playTone(523.25, 0.15); // C5
  setTimeout(() => playTone(659.25, 0.15), 100); // E5
  setTimeout(() => playTone(783.99, 0.3), 200); // G5
}

function playIncorrectSound() {
  playTone(220, 0.2, 'sawtooth', 0.2);
  setTimeout(() => playTone(180, 0.3, 'sawtooth', 0.2), 150);
}

function playCompleteSound() {
  const notes = [523.25, 659.25, 783.99, 1046.50];
  notes.forEach((n, i) => setTimeout(() => playTone(n, 0.2), i * 100));
}

function playClickSound() {
  playTone(800, 0.05, 'square', 0.1);
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  document.getElementById('soundToggle').textContent = soundEnabled ? '🔊' : '🔇';
}

// ============ PAGE DATA (5 STRATEGY + 15 PRACTICE) ============
const pages = [
  // ============ STRATEGY PAGES 1-5 ============
  {
    type: 'strategy',
    title: 'Introduction to 7-Choose-5',
    category: 'Strategy 1',
    subtitle: 'Understanding the Gaokao Question Type',
    content: `
      <h3>🎯 What is 7-Choose-5?</h3>
      <p>The "7-Choose-5" (七选五) is a signature reading comprehension section in the Gaokao English exam. You will read a passage of approximately <strong>300 words</strong> with <strong>5 blanks (36–40)</strong>, and choose the best sentence from <strong>7 options (A–G)</strong> to fill each blank. Two options are extra distractors.</p>
      
      <h3>📊 What Does It Test?</h3>
      <ul>
        <li><strong>Overall comprehension</strong> of the passage structure and macro-organization</li>
        <li><strong>Logical reasoning</strong> between adjacent sentences</li>
        <li><strong>Cohesion awareness</strong> (pronouns, transitional words, lexical repetition)</li>
        <li><strong>Information matching</strong> in context</li>
      </ul>
      
      <h3>⏱ Time Management</h3>
      <div class="tip-box">Spend <strong>8–10 minutes</strong> on this section. Read the title and first paragraph to grasp the theme, then tackle blanks one by one using contextual clues.</div>
      
      <h3>🔑 The Golden Rule</h3>
      <p>Every correct answer has <strong>textual evidence</strong> — either right before the blank, right after the blank, or both. Never guess based on a vague "feeling". Always locate the exact logical or lexical link.</p>
      
      <div class="example-box">
        <strong>Example Pattern:</strong><br>
        "Many people enjoy coffee. <u>___36___</u> However, tea is becoming more popular."<br>
        → The blank needs a positive statement about coffee (matching before) that contrasts with tea's rising popularity (after). A sentence like "It is the most consumed morning beverage worldwide" fits seamlessly.
      </div>
      
      <h3>📚 The 5 Core Skills You'll Master</h3>
      <ol>
        <li><strong>Cohesion & Coherence</strong> — how sentences link together</li>
        <li><strong>Pronoun Reference</strong> — tracking <em>it, they, this, such</em></li>
        <li><strong>Logical Connectors</strong> — <em>however, therefore, instead, or</em></li>
        <li><strong>Topic Sentences</strong> — identifying paragraph main ideas</li>
        <li><strong>Parallel Structure</strong> — recognizing rhetorical patterns</li>
      </ol>
      <p>Click through the next 4 strategy pages to master each skill, then tackle 15 authentic Gaokao practice passages!</p>
    `
  },
  {
    type: 'strategy',
    title: 'Cohesion & Coherence',
    category: 'Strategy 2',
    subtitle: 'How Sentences Connect',
    content: `
      <h3>🔗 What is Cohesion?</h3>
      <p>Cohesion refers to the grammatical and lexical links that hold a text together. In 7-Choose-5, the correct answer almost always has <strong>clear cohesive ties</strong> to the surrounding text.</p>
      
      <h3>🎯 Four Types of Cohesion</h3>
      
      <h4>1. Lexical Repetition (词汇复现)</h4>
      <p>The exact same word, a synonym, or a hyponym appears in both the blank option and the surrounding text.</p>
      <div class="example-box">
        "Regular <strong>exercise</strong> improves health. <u>___</u> This <strong>physical activity</strong> reduces stress."
        <br>→ "physical activity" repeats the concept of "exercise"
      </div>
      
      <h4>2. Pronoun Reference (代词指代)</h4>
      <p>Pronouns like <em>it, they, this, that, these, such</em> refer back to something mentioned earlier.</p>
      <div class="example-box">
        "Her notice included training type, days, hours, and phone number. <u>___</u>"
        <br>→ "Any notice for a training partner should include <strong>such information</strong>."
      </div>
      
      <h4>3. Connector Words (逻辑连接词)</h4>
      <p>Words like <em>however, therefore, moreover, for example, instead</em> signal logical relationships.</p>
      <div class="example-box">
        "The plan seemed perfect. <u>___</u> <strong>However</strong>, unexpected problems arose."
        <br>→ "However" signals a sharp contrast.
      </div>
      
      <h4>4. Structural Parallelism (结构平行)</h4>
      <p>Questions, imperatives, and numbered sequences create predictable patterns.</p>
      <div class="example-box">
        "First, decide what you want. <u>___</u> <strong>Or do you just want</strong> to be physically fit?"
        <br>→ The blank needs a parallel question: "<strong>Do you want</strong> to be a better athlete?"
      </div>
      
      <div class="tip-box">When analyzing a blank, ask: "What specific word or structure in the option hooks onto the surrounding sentences?"</div>
    `
  },
  {

      <h3>👆 Why Pronouns Matter</h3>
      <p>Pronouns are the <strong>#1 clue</strong> in 7-Choose-5. If an option contains a pronoun or determiner, you MUST verify what it refers to in the preceding sentence.</p>
      
      <h3>📋 Common Pronoun Clues</h3>
      <ul>
        <li><strong>it / its</strong> → refers to a singular noun or action mentioned before</li>
        <li><strong>they / them / their</strong> → refers to a plural noun mentioned before</li>
        <li><strong>this / that + noun</strong> → encapsulates an idea, problem, or method just described</li>
        <li><strong>these / such + noun</strong> → refers back to a specific list or category</li>
        <li><strong>one / another / the other</strong> → signals a multi-part list</li>
      </ul>
      
      <h3>🔍 Worked Example (2022 New Gaokao Vol. I)</h3>
      <div class="example-box">
        "My partner posted her request on the notice board of a local park. Her notice included what kind of training she wanted to do, how many days a week and how many hours she wanted to spend on each session, and her age. It also listed her favorite sports and activities, and provided her phone number. <u>___39___</u>"<br><br>
        <strong>Correct Option G:</strong> "Any notice for a training partner should include <strong>such information</strong>."<br>
        <strong>Analysis:</strong> The phrase "such information" directly summarizes the long list of details (training type, days, hours, age, sports, phone number) in the preceding two sentences!
      </div>
      
      <h3>⚠️ Watch Out for Traps</h3>
      <p>Distractors often contain pronouns that <strong>don't match</strong> the number or gender of nouns in the text:</p>
      <ul>
        <li>Option says "they" when the preceding sentence only has a singular subject</li>
        <li>Option says "this method" when no method was introduced yet</li>
      </ul>
      
      <div class="tip-box">Highlight pronouns in options A–G before you even read the passage!</div>

      <h4>1. Contrast (转折与对比)</h4>

        "She studied every night. <u>___</u> Therefore, she passed the exam with flying colors."

      <h4>3. Addition (递进与并列)</h4>

      <p>Where the blank is located inside the paragraph gives you a huge clue about its function:</p>
      
      <h4>1. Blank at the START of a Paragraph (段首题)</h4>
      <ul>
        <li>Usually functions as the <strong>Topic Sentence (主旨句)</strong> summarizing the whole paragraph.</li>
        <li>Or functions as a <strong>Transition Sentence (过渡句)</strong> linking the previous paragraph to the new one.</li>
        <li>Look for concise imperatives or broad statements that match the paragraph's details.</li>

      <h4>2. Blank in the MIDDLE of a Paragraph (段中题)</h4>
      <ul>

        <li>Look for phrases like <em>such information, in short, therefore, as a result</em>.</li>

}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
}

function updateClockDisplay() {
  const clockEl = document.getElementById('digitalClock');
  if (!clockEl) return;
  clockEl.textContent = formatTime(timerSeconds);
  clockEl.classList.remove('warning', 'danger');
  if (timerSeconds <= 30) {
    clockEl.classList.add('danger');
  } else if (timerSeconds <= 90) {
    clockEl.classList.add('warning');
  }
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  timerRunning = false;
  const btn = document.getElementById('timerStartStopBtn');
  if (btn) {
    btn.textContent = 'Start';
    btn.classList.remove('running');
  }
}

function startTimer() {
  if (timerRunning) return;
  if (timerSeconds <= 0) {
    timerSeconds = getRecommendedSeconds(pages[currentPageIndex]);
  }
  timerRunning = true;
  const btn = document.getElementById('timerStartStopBtn');
  if (btn) {
    btn.textContent = 'Stop';
    btn.classList.add('running');
  }
  timerInterval = setInterval(() => {
    if (timerSeconds > 0) {
      timerSeconds--;
      updateClockDisplay();
      if (timerSeconds === 0) {
        stopTimer();
        playIncorrectSound();
      }
    }
  }, 1000);
}

function toggleTimer() {
  playClickSound();
  if (timerRunning) {
    stopTimer();
  } else {
    startTimer();
  }
}

function resetTimer() {
  playClickSound();
  stopTimer();
  const page = pages[currentPageIndex];
  timerSeconds = getRecommendedSeconds(page);
  const recLabel = document.getElementById('recTimeLabel');
  if (recLabel) recLabel.textContent = page.type === 'strategy' ? '3:00' : '8:00';
  updateClockDisplay();
}

// ============ INITIALIZATION ============
function init() {
  renderNavButtons();
  loadPage(0);
}

function renderNavButtons() {
  const select = document.getElementById('pageSelect');
  if (!select) return;
  select.innerHTML = pages.map((page, idx) => {
    const selectedAttr = idx === currentPageIndex ? 'selected' : '';
    const checkMark = pageStates[idx].completed ? ' ✓' : '';
    const label = page.type === 'strategy'
      ? `S${idx + 1}: ${page.title}${checkMark}`
      : `P${idx - 4}: ${page.title}${checkMark}`;
    return `<option value="${idx}" ${selectedAttr}>${label}</option>`;
  }).join('');
}

function switchPage(idx) {
  playClickSound();
  selectedBlankNum = null;
  loadPage(idx);
}

function loadPage(idx) {
  const pageChanged = currentPageIndex !== idx;
  currentPageIndex = idx;
  const page = pages[idx];
  const state = pageStates[idx];
  const leftPanel = document.getElementById('leftPanel');
  const optionsList = document.getElementById('optionsList');
  const optionsTitle = document.getElementById('optionsTitle');
  const practiceControls = document.getElementById('practiceControls');
  const strategyControls = document.getElementById('strategyControls');
  const feedback = document.getElementById('feedback');

  if (pageChanged || (!timerRunning && timerSeconds === 480)) {
    stopTimer();
    timerSeconds = getRecommendedSeconds(page);
    const recLabel = document.getElementById('recTimeLabel');
    if (recLabel) recLabel.textContent = page.type === 'strategy' ? '3:00' : '8:00';
    updateClockDisplay();
  }

  feedback.className = 'feedback';
  feedback.innerHTML = '';

  if (page.type === 'strategy') {
    practiceControls.style.display = 'none';
    strategyControls.style.display = 'block';
    optionsTitle.textContent = '🧭 Strategy Quick Summary';

    leftPanel.innerHTML = `
      <div class="page-header">
        <div class="page-category">${page.category}</div>
        <div class="page-title">${page.title}</div>
        <div class="page-subtitle">${page.subtitle}</div>
      </div>
      <div class="strategy-content">${page.content}</div>
    `;

    optionsList.innerHTML = `
      <div class="tip-box" style="margin-top:0;">
        <strong>Key Takeaway:</strong><br>
        Read through this strategy guide carefully. Once you understand the patterns, click <strong>"Mark Read & Next Page"</strong> below or jump directly to any of the 15 Practice Passages (P1–P15) in the top navigation bar!
      </div>
      <div class="example-box">
        <strong>7-Choose-5 Checklist:</strong><br>
        1. Check pronouns (<em>it, they, this, such</em>)<br>
        2. Check logical connectors (<em>however, or, also</em>)<br>
        3. Check blank position (Start, Middle, End)<br>
        4. Eliminate the 2 distractors
      </div>
    `;
  } else {
    practiceControls.style.display = 'block';
    strategyControls.style.display = 'none';
    optionsTitle.textContent = '📝 Answer Options (Click Blank, Then Option)';

    // Format passage paragraphs and replace ___36___ etc. with interactive blanks
    const paragraphs = page.passage.split(/\n\s*\n/).map(para => {
      const formatted = para.trim().replace(/___(\d+)___/g, (match, num) => {
        const blankNum = parseInt(num);
        const chosenLetter = state.userAnswers[blankNum];
        const chosenOpt = chosenLetter ? page.options.find(o => o.letter === chosenLetter) : null;

        let classes = 'blank';
        if (selectedBlankNum === blankNum) classes += ' selected';
        else if (state.graded) {
          classes += (chosenLetter === page.answers[blankNum]) ? ' correct' : ' incorrect';
        } else if (chosenLetter) {
          classes += ' filled';
        }

        const displayText = chosenOpt
          ? `${blankNum}. [${chosenLetter}] ${chosenOpt.text}`
          : `___${blankNum}___`;

        return `<span class="${classes}" onclick="selectBlank(${blankNum})">${displayText}</span>`;
      });
      return `<p>${formatted}</p>`;
    }).join('');

    // Build explanations section if graded
    let expHtml = '';
    if (state.graded) {
      const items = [36, 37, 38, 39, 40].map(num => {
        const ans = page.answers[num];
        const userAns = state.userAnswers[num] || 'None';
        const isRight = userAns === ans;
        const badge = isRight ? '✅' : `❌ (Your answer: ${userAns})`;
        return `<div class="exp-item">${badge} <strong>Blank ${num} — Correct Answer: ${ans}</strong><br>${page.explanations[num]}</div>`;
      }).join('');
      expHtml = `<div class="explanations-box show"><h4>🔍 Detailed Logical Analysis (答案解析)</h4>${items}</div>`;
    }

    leftPanel.innerHTML = `
      <div class="page-header">
        <div class="page-category">${page.category}</div>
        <div class="page-title">${page.title}</div>
        <div class="page-subtitle">${page.subtitle} — Click a blank (36–40) in the passage, then click an option (A–G) on the right.</div>
      </div>
      <div class="passage">${paragraphs}</div>
      ${expHtml}
    `;

    renderOptions();
  }

  leftPanel.scrollTop = 0;
  renderNavButtons();
  updateStats();
}

function renderOptions() {
  const page = pages[currentPageIndex];
  if (page.type !== 'practice') return;

  const state = pageStates[currentPageIndex];
  const usedLetters = Object.values(state.userAnswers).filter(Boolean);
  const currentBlankChoice = selectedBlankNum ? state.userAnswers[selectedBlankNum] : null;

  const optionsList = document.getElementById('optionsList');
  optionsList.innerHTML = page.options.map(opt => {
    const isSelectedForActiveBlank = currentBlankChoice === opt.letter;
    const isUsedElsewhere = usedLetters.includes(opt.letter) && !isSelectedForActiveBlank;

    let cls = 'option';
    if (isSelectedForActiveBlank) cls += ' selected';
    else if (isUsedElsewhere) cls += ' used';

    return `
      <div class="${cls}" onclick="selectOption('${opt.letter}')">
        <span class="option-letter">${opt.letter}</span>
        <span>${opt.text}</span>
      </div>
    `;
  }).join('');
}

// ============ INTERACTION HANDLERS ============
function selectBlank(blankNum) {
  playClickSound();
  const state = pageStates[currentPageIndex];
  if (state.graded) {
    state.graded = false; // Allow editing if user clicks a blank after grading
  }
  selectedBlankNum = blankNum;
  loadPage(currentPageIndex);
}

function selectOption(letter) {
  const page = pages[currentPageIndex];
  const state = pageStates[currentPageIndex];
  if (page.type !== 'practice') return;

  // If no blank is currently selected, automatically pick the first empty blank (or 36)
  if (!selectedBlankNum) {
    const emptyBlank = [36, 37, 38, 39, 40].find(n => !state.userAnswers[n]);
    selectedBlankNum = emptyBlank || 36;
  }

  playClickSound();
  state.graded = false;

  // Remove this letter if it was already used in another blank
  [36, 37, 38, 39, 40].forEach(num => {
    if (state.userAnswers[num] === letter) {
      state.userAnswers[num] = null;
    }
  });

  state.userAnswers[selectedBlankNum] = letter;

  // Auto-advance to the next empty blank
  const nextEmpty = [36, 37, 38, 39, 40].find(n => !state.userAnswers[n]);
  selectedBlankNum = nextEmpty || null;

  loadPage(currentPageIndex);
}

function checkAllAnswers() {
  const page = pages[currentPageIndex];
  const state = pageStates[currentPageIndex];
  if (page.type !== 'practice') return;

  const answered = Object.values(state.userAnswers).filter(Boolean).length;
  const feedback = document.getElementById('feedback');

  if (answered < 5) {
    playIncorrectSound();
    feedback.className = 'feedback show incorrect';
    feedback.innerHTML = `<div class="feedback-title">Incomplete (${answered}/5 Answered)</div>Please fill in all 5 blanks (36–40) before checking your answers, or click "Show Answers & Logic".`;
    return;
  }

  state.graded = true;
  selectedBlankNum = null;

  let correct = 0;
  [36, 37, 38, 39, 40].forEach(num => {
    if (state.userAnswers[num] === page.answers[num]) correct++;
  });

  state.completed = true;
  loadPage(currentPageIndex);

  const fb = document.getElementById('feedback');
  if (correct === 5) {
    playCompleteSound();
    fb.className = 'feedback show correct';
    fb.innerHTML = `<div class="feedback-title">🏆 Perfect Score! (5/5)</div>Outstanding! Scroll down the passage panel to review the detailed logical analysis for each blank.`;
  } else if (correct >= 3) {
    playCorrectSound();
    fb.className = 'feedback show correct';
    fb.innerHTML = `<div class="feedback-title">👍 Good Job! (${correct}/5 Correct)</div>Scroll down the passage on the left to read the explanations for any missed blanks.`;
  } else {
    playIncorrectSound();
    fb.className = 'feedback show incorrect';
    fb.innerHTML = `<div class="feedback-title">📚 Keep Practicing (${correct}/5 Correct)</div>Review the detailed logical explanations at the bottom of the passage panel.`;
  }

  document.getElementById('modalText').textContent = `You scored ${correct} out of 5 on "${page.title}".`;
  document.getElementById('completionModal').classList.add('show');
}

function resetPage() {
  playClickSound();
  const page = pages[currentPageIndex];
  if (page.type !== 'practice') return;

  pageStates[currentPageIndex] = {
    completed: false,
    userAnswers: { 36: null, 37: null, 38: null, 39: null, 40: null },
    graded: false
  };
  selectedBlankNum = 36;
  loadPage(currentPageIndex);
}

function showAnswers() {
  playClickSound();
  const page = pages[currentPageIndex];
  const state = pageStates[currentPageIndex];
  if (page.type !== 'practice') return;

  [36, 37, 38, 39, 40].forEach(num => {
    state.userAnswers[num] = page.answers[num];
  });
  state.graded = true;
  state.completed = true;
  selectedBlankNum = null;

  loadPage(currentPageIndex);

  const fb = document.getElementById('feedback');
  fb.className = 'feedback show correct';
  fb.innerHTML = `<div class="feedback-title">👁 Answers Revealed</div>All correct sentences are now placed in the blanks, and full logical explanations are shown below the passage.`;
}

function nextPage() {
  playCorrectSound();
  pageStates[currentPageIndex].completed = true;
  const nextIdx = (currentPageIndex + 1) % pages.length;
  loadPage(nextIdx);
}

function updateStats() {
  const page = pages[currentPageIndex];
  const state = pageStates[currentPageIndex];

  document.getElementById('pageNum').textContent = `${currentPageIndex + 1}/${pages.length}`;

  if (page.type === 'strategy') {
    document.getElementById('correctCount').textContent = '-';
    document.getElementById('answeredCount').textContent = 'Guide';
    return;
  }

  const answered = Object.values(state.userAnswers).filter(Boolean).length;
  let correct = 0;
  if (state.graded) {
    [36, 37, 38, 39, 40].forEach(num => {
      if (state.userAnswers[num] === page.answers[num]) correct++;
    });
  }

  document.getElementById('correctCount').textContent = state.graded ? correct : '-';
  document.getElementById('answeredCount').textContent = `${answered}/5`;
}

function closeModal() {
  playClickSound();
  document.getElementById('completionModal').classList.remove('show');
}

function closeModalAndNext() {
  closeModal();
  const nextIdx = (currentPageIndex + 1) % pages.length;
  loadPage(nextIdx);
}

window.onload = init;
</script>
