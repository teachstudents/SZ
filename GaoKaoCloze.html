        function App() {
            const [selectedPassageId, setSelectedPassageId] = useState(null);
            const [userAnswers, setUserAnswers] = useState({});
            const [submitted, setSubmitted] = useState(false);
            const [score, setScore] = useState(0);
            const [focusedBlank, setFocusedBlank] = useState(null);

            const selectedPassage = useMemo(() => 
                passagesData.find(p => p.id === selectedPassageId), 
            [selectedPassageId]);

            const handleInputChange = (blankId, value) => {
                setUserAnswers(prev => ({ ...prev, [blankId]: value }));
            };

            const handleDrop = (e, blankId) => {
                e.preventDefault();
                const data = e.dataTransfer.getData('text/plain');
                if (data) {
                    handleInputChange(blankId, data);
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            const handleSubmit = () => {
                let currentScore = 0;
                Object.keys(selectedPassage.answers).forEach(blankId => {
                    const userAns = (userAnswers[blankId] || "").trim().toLowerCase();
                    const correctAnswers = selectedPassage.answers[blankId].map(a => a.toLowerCase());
                    if (correctAnswers.includes(userAns)) {
                        currentScore += 1;
                    }
                });
                setScore(currentScore);
                setSubmitted(true);
            };

            const handleBack = () => {
                setSelectedPassageId(null);
                setUserAnswers({});
                setSubmitted(false);
                setScore(0);
                setFocusedBlank(null);
            };

            const renderPassageText = (text) => {
                const parts = text.split(/(\[#\d+#\]|<clue>.*?<\/clue>)/g);
                return parts.map((part, index) => {
                    const match = part.match(/\[#(\d+)#\]/);
                    if (match) {
                        const blankId = match[1];
                        const isCorrect = submitted && selectedPassage.answers[blankId].map(a=>a.toLowerCase()).includes((userAnswers[blankId] || "").trim().toLowerCase());
                        const isWrong = submitted && !isCorrect;
                        
                        return (
                            <span key={index} className="gap-container">
                                <span className="text-[14px] font-bold text-slate-400 absolute -top-6 left-1/2 -translate-x-1/2">{blankId}</span>
                                <input
                                    type="text"
                                    className={`gap-input ${isCorrect ? 'correct' : ''} ${isWrong ? 'incorrect' : ''}`}
                                    value={userAnswers[blankId] || ""}
                                    onChange={(e) => handleInputChange(blankId, e.target.value)}
                                    onFocus={() => setFocusedBlank(blankId)}
                                    onDrop={(e) => handleDrop(e, blankId)}
                                    onDragOver={handleDragOver}
                                    disabled={submitted}
                                    placeholder="?"
                                    readOnly={selectedPassage.type === 'cloze'}
                                />
                                {isWrong && (
                                    <span className="text-emerald-600 font-bold ml-1 text-[15px] absolute -bottom-7 left-1/2 -translate-x-1/2 whitespace-nowrap bg-emerald-50 px-2 py-0.5 rounded-md shadow-sm border border-emerald-100 z-10">
                                        {selectedPassage.answers[blankId][0]}
                                    </span>
                                )}
                            </span>
                        );
                    }
                    const clueMatch = part.match(/<clue>(.*?)<\/clue>/);
                    if (clueMatch) {
                        return <span key={index} className={submitted ? "clue-highlight" : "transition-all"}>{clueMatch[1]}</span>;
                    }
                    return <span key={index} dangerouslySetInnerHTML={{ __html: part }} />;
                });
            };

            if (selectedPassageId) {
                return (
                    <div className="w-full h-screen flex flex-col bg-white">
                        <header className="sticky top-0 z-50 bg-white border-b border-slate-200 p-4 shadow-sm flex items-center justify-between w-full">
                            <button onClick={handleBack} className="flex items-center gap-2 text-slate-600 hover:text-blue-600 font-bold px-4 py-2 bg-slate-100 rounded-full transition-colors">
                                <ArrowLeft size={20} /> Back
                            </button>
                            
                            {!submitted ? (
                                <button 
                                    onClick={handleSubmit}
                                    className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-10 text-lg rounded-full shadow transition-all transform hover:-translate-y-1"
                                >
                                    Submit Answers
                                </button>
                            ) : (
                                <div className="flex items-center gap-4 md:gap-8 bg-slate-50 px-6 py-2 rounded-full border border-slate-200 shadow-inner">

                                        className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-8 text-lg rounded-full shadow-lg transition-all ml-4"
                                    >
                                        Continue
                                    </button>
                                </div>
                            )}
                        </header>

                        <div className="flex-1 overflow-y-auto px-4 md:px-12 py-8 w-full bg-white">
                            <div className="passage-text text-slate-800 w-full">
                                {renderPassageText(selectedPassage.content)}
                            </div>

                            {selectedPassage.type === 'cloze' && !submitted && (
                                <div className="mt-16 bg-slate-50 p-6 rounded-2xl border border-slate-200 w-full mb-20 shadow-sm">
                                    <h3 className="text-xl font-bold text-slate-800 mb-6">Word Choices (Drag, Tap, or Click into blanks)</h3>
                                    <div className="flex flex-col gap-5">
                                        {Object.keys(selectedPassage.options).map(blankId => (
                                            <div key={blankId} className="flex flex-wrap items-center gap-4">
                                                <span className="font-black text-blue-600 text-2xl w-10 text-right">{blankId}.</span>
                                                {selectedPassage.options[blankId].map(opt => {
                                                    const isSelected = userAnswers[blankId] === opt;
                                                    return (
                                                        <button
                                                            key={opt}
                                                            draggable
                                                            onDragStart={(e) => {
                                                                e.dataTransfer.setData('text/plain', opt);
                                                            }}
                                                            onClick={() => handleInputChange(blankId, opt)}
                                                            className={`mcq-option ${isSelected ? 'ring-2 ring-blue-500 bg-blue-50 text-blue-700' : 'text-slate-700'}`}
                                                        >
                                                            {opt}
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            const clozePassages = passagesData.filter(p => p.type === 'cloze');
            const gapFillPassages = passagesData.filter(p => p.type !== 'cloze');

            return (
                <div className="max-w-[1400px] w-full mx-auto p-4 md:p-8 animate-fade-in pb-20">
                    <header className="mb-10 text-center mt-4 flex items-center justify-center gap-4">
                        <div className="inline-flex items-center justify-center p-4 bg-blue-600 text-white rounded-2xl shadow-lg transform -rotate-3 hover:rotate-0 transition-transform">
                            <BookOpen size={36} />
                        </div>
                        <h1 className="text-4xl font-black text-slate-800">Gaokao Reading Master</h1>
                    </header>

                    <div className="mb-12">
                        <h2 className="text-2xl font-black text-slate-800 mb-6 border-b-4 border-blue-600 pb-2 inline-block">Gap Fill (语法填空)</h2>
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                            {gapFillPassages.map((passage, idx) => (
                                <button 
                                    key={passage.id}
                                    onClick={() => setSelectedPassageId(passage.id)}
                                    className="bg-white rounded-2xl p-4 md:p-5 shadow-sm hover:shadow-lg border border-slate-100 text-left transition-all transform hover:-translate-y-1 group flex flex-col h-full relative overflow-hidden"
                                >
                                    <div className="absolute top-0 right-0 w-16 h-16 bg-gradient-to-br from-slate-50 to-transparent rounded-bl-full -z-0 opacity-50 group-hover:from-blue-50 transition-colors"></div>
                                    <div className="flex justify-between items-start mb-3 relative z-10">
                                        <span className="text-slate-200 font-black text-xl md:text-2xl group-hover:text-blue-100 transition-colors">
                                            #{idx + 1}
                                        </span>
                                    </div>
                                    <h3 className="text-sm md:text-base font-bold text-slate-800 group-hover:text-blue-600 transition-colors line-clamp-3 relative z-10">
                                        {passage.title}
                                    </h3>
                                </button>
                            ))}
                        </div>
                    </div>

                    <div className="mb-12">
                        <h2 className="text-2xl font-black text-slate-800 mb-6 border-b-4 border-emerald-600 pb-2 inline-block">Cloze Test (完形填空)</h2>
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
                            {clozePassages.map((passage, idx) => (
                                <button 
                                    key={passage.id}
                                    onClick={() => setSelectedPassageId(passage.id)}
                                    className="bg-white rounded-2xl p-4 md:p-5 shadow-sm hover:shadow-lg border border-slate-100 text-left transition-all transform hover:-translate-y-1 group flex flex-col h-full relative overflow-hidden"
                                >
                                    <div className="absolute top-0 right-0 w-16 h-16 bg-gradient-to-br from-slate-50 to-transparent rounded-bl-full -z-0 opacity-50 group-hover:from-emerald-50 transition-colors"></div>
                                    <div className="flex justify-between items-start mb-3 relative z-10">
                                        <span className="text-slate-200 font-black text-xl md:text-2xl group-hover:text-emerald-100 transition-colors">
                                            #{idx + 1}
                                        </span>
                                    </div>
                                    <h3 className="text-sm md:text-base font-bold text-slate-800 group-hover:text-emerald-600 transition-colors line-clamp-3 relative z-10">
                                        {passage.title}
                                    </h3>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
